<style>
/* Layout: a single "video player" — 1280x720 stage scaled to fit, captions + chapters below. Single deliberate dark look. */
:root{
  --bg:#060608; --bg2:#0d0d12; --bg3:#15151c; --grid:rgba(190,185,255,.05);
  --line:#7d7b88; --line2:#44434d; --ink:#eeedf3; --dim:#9a98a6; --faint:#5e5c68;
  --acc:#b48cff; --acc-soft:rgba(180,140,255,.12);
  --peso:#57d4c2; --normal:#eeedf3; --roce:#ff6b7d; --ten:#b48cff; --ela:#f4b55c; --acel:#ff8fd0; --vel:#8fc7ff;
  --K:#b48cff; --Ug:#57d4c2; --Ue:#f4b55c;
  --f-disp:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Figtree',ui-sans-serif,system-ui,sans-serif;
  --f-math:'STIX Two Text','Cambria Math',Cambria,Georgia,serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top .kick{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.top h1{font-family:var(--f-disp);font-stretch:112%;font-weight:800;font-size:clamp(22px,3.2vw,32px);letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
.top p{margin:0;color:var(--dim);font-size:14px;font-family:var(--f-mono)}

#player{background:#000;border-radius:14px;overflow:hidden;border:1px solid #1c1b23;position:relative}
#player:fullscreen{border-radius:0;border:0;display:flex;flex-direction:column;justify-content:center;background:#000}
#frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--bg);margin:0 auto;max-width:100%}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(0,0,0,.78) 100%),
    linear-gradient(var(--grid) 2px,transparent 2px) 0 0/80px 80px,
    linear-gradient(90deg,var(--grid) 2px,transparent 2px) 0 0/80px 80px,
    var(--bg);
  animation:drift 90s linear infinite}
@keyframes drift{to{background-position:0 0,0 80px,80px 0,0 0}}
.mark{position:absolute;right:26px;bottom:20px;font-family:var(--f-mono);font-size:15px;letter-spacing:.12em;color:var(--faint);z-index:5}

#big{position:absolute;inset:0;margin:auto;width:116px;height:116px;border-radius:50%;border:2px solid var(--acc);background:rgba(10,8,16,.75);color:var(--ink);cursor:pointer;display:grid;place-items:center;z-index:6;box-shadow:0 0 60px rgba(180,140,255,.35);transition:transform .2s}
#big:hover{transform:scale(1.06)}
#big svg{width:44px;height:44px;margin-left:6px}
#resume{position:absolute;left:50%;bottom:18px;translate:-50% 0;z-index:7;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#resume button{font:600 14px var(--f-body);color:var(--ink);background:rgba(20,18,28,.92);border:1px solid var(--acc);border-radius:999px;padding:8px 14px;cursor:pointer}
#resume button+button{border-color:#2d2c36;color:var(--dim)}

#ctl{display:flex;flex-direction:column;gap:6px;padding:10px 12px 10px;background:#000}
#bar{position:relative;height:20px;cursor:pointer;touch-action:none;outline:none}
#bar .tr{position:absolute;left:0;right:0;top:8px;height:4px;background:#2a2932;border-radius:2px}
#bar .fill{position:absolute;left:0;top:8px;height:4px;background:var(--acc);border-radius:2px;width:0}
#bar .knob{position:absolute;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;translate:-50% 0;left:0;box-shadow:0 0 0 3px rgba(180,140,255,.35)}
#bar .tick{position:absolute;top:8px;width:3px;height:4px;background:#000;translate:-50% 0}
#bar:focus-visible .tr{outline:2px solid var(--acc);outline-offset:4px}
#tip{position:absolute;bottom:22px;translate:-50% 0;background:#16151d;border:1px solid #2d2c36;color:var(--ink);font:500 12px var(--f-body);padding:5px 9px;border-radius:7px;white-space:nowrap;pointer-events:none}
.row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
button.ic{background:none;border:0;color:var(--ink);width:40px;height:36px;border-radius:8px;display:grid;place-items:center;cursor:pointer;padding:0}
button.ic svg{width:22px;height:22px}
button.ic:hover{background:#1a1a21}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#time{font-family:var(--f-mono);font-size:13px;color:var(--dim);margin:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
#chName{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 120px}
button.tx{font:600 13px var(--f-mono);color:var(--ink);background:#15151b;border:1px solid #2a2930;border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
button.tx[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
button.tx:disabled{opacity:.45;cursor:not-allowed}
#cap{padding:16px 20px 18px;background:var(--bg2);border-top:1px solid #1c1b23;min-height:118px}
#cap .ct{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
#cap .cx{font-size:clamp(16px,2.1vw,20px);line-height:1.55;color:var(--ink);max-width:78ch;text-wrap:pretty}
#player:fullscreen #cap{min-height:0}

section h3{font-family:var(--f-disp);font-stretch:110%;font-weight:800;font-size:20px;margin:6px 0 10px}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.chs button{text-align:left;background:var(--bg2);border:1px solid #1d1c25;border-radius:10px;padding:12px 14px;color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:flex-start;min-width:0}
.chs button:hover{border-color:#34333e}
.chs button.on{border-color:var(--acc);background:#120f1b}
.chs .n{font-family:var(--f-mono);color:var(--faint);font-size:13px;padding-top:2px;font-variant-numeric:tabular-nums}
.chs .t{font-weight:600;font-size:15px;display:block}
.chs .s{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.keys{color:var(--dim);font-size:13px;margin:0}
kbd,.kb{font-family:var(--f-mono);font-size:.85em;border:1px solid #34333e;border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:#14141a;color:var(--ink)}

[hidden]{display:none!important}
/* ===== stage content ===== */
.scene{position:absolute;inset:0;transition:opacity .75s ease,transform 1s cubic-bezier(.2,.8,.2,1),filter .75s ease}
.scene.pre{opacity:0;transform:scale(1.04) translateY(10px);filter:blur(10px)}
.scene.out{opacity:0;transform:scale(.97);filter:blur(8px);pointer-events:none}
.scene svg.art{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}
.hdr{position:absolute;left:64px;top:42px;right:64px}
.hdr .tag{font-family:var(--f-mono);font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.hdr h2{font-family:var(--f-disp);font-stretch:115%;font-weight:800;font-size:42px;margin:6px 0 0;letter-spacing:-.01em;color:var(--ink);line-height:1.1}

.eq{position:absolute;font-family:var(--f-math);font-size:36px;color:var(--ink);white-space:nowrap;line-height:1.25}
.eq i{font-style:italic}
.eq .w{font-family:var(--f-body);font-style:normal;font-size:.68em;color:var(--dim);letter-spacing:.01em}
.eq sub{font-size:.6em;vertical-align:-.3em;line-height:0;font-style:normal}
.eq sup{font-size:.6em;vertical-align:.62em;line-height:0}
.eq.s{font-size:30px}.eq.xs{font-size:25px}.eq.l{font-size:50px}.eq.xl{font-size:70px}
.eq.dim{color:var(--dim)}.eq.acc{color:var(--acc)}
.eq.box{border:2px solid var(--acc);border-radius:10px;padding:6px 18px;background:rgba(180,140,255,.07);box-shadow:0 0 40px rgba(180,140,255,.16)}
.c{translate:-50% 0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.08;font-size:.9em}
.fr>span:first-child{border-bottom:.055em solid currentColor;padding:0 .22em .05em}
.fr>span:last-child{padding:.05em .22em 0}
.rt{white-space:nowrap}
.rt>.rad{border-top:.055em solid currentColor;padding:.04em .12em 0;margin-left:.03em;display:inline-block;line-height:1.15}
.unit{font-style:normal;color:var(--dim)}
.eq .hl,.eq.hl{color:var(--acc);text-shadow:0 0 24px rgba(180,140,255,.7)}
.nt{position:absolute;font-family:var(--f-body);font-size:26px;line-height:1.38;color:var(--dim);white-space:normal}
.nt b{color:var(--ink);font-weight:600}
.nt.acc{color:var(--acc)}
.nt i{font-family:var(--f-math)}
.pill.nc{text-transform:none;letter-spacing:.02em;font-size:18px}
.pill{position:absolute;font-family:var(--f-mono);font-size:17px;letter-spacing:.1em;text-transform:uppercase;padding:7px 15px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.panel{position:absolute;border:1.5px solid var(--line2);border-radius:14px;background:rgba(16,16,22,.72)}
.node{position:absolute;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;padding:14px 18px;background:rgba(12,12,18,.9);font-family:var(--f-disp);font-stretch:108%;font-weight:700;font-size:27px;color:var(--ink);line-height:1.1}
.node small{display:block;font-family:var(--f-math);font-weight:400;font-size:22px;color:var(--dim);margin-top:6px}
.node small i{font-style:italic}.node small sub{font-size:.65em}
.node.acc{border-color:var(--acc);box-shadow:0 0 30px rgba(180,140,255,.18)}
.li{position:absolute;display:flex;gap:18px;align-items:baseline;font-size:28px;line-height:1.35;color:var(--dim);font-family:var(--f-body)}
.li .num{font-family:var(--f-mono);font-size:19px;color:var(--acc);border:1.5px solid var(--acc);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;flex:none;transform:translateY(-3px)}
.li b{color:var(--ink);font-weight:600}
.li i{font-family:var(--f-math)}
.hk{position:absolute;font-family:var(--f-mono);font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.hero{position:absolute;font-family:var(--f-disp);font-weight:900;font-stretch:112%;font-size:128px;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.hsub{position:absolute;font-family:var(--f-body);font-size:31px;color:var(--dim)}
.card .cnum{position:absolute;left:140px;top:150px;font-family:var(--f-disp);font-weight:900;font-stretch:125%;font-size:150px;line-height:1;color:transparent;-webkit-text-stroke:2px var(--line)}
.card .csub{position:absolute;left:146px;top:338px;font-family:var(--f-mono);font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.card .cttl{position:absolute;left:140px;top:372px;font-family:var(--f-disp);font-weight:800;font-stretch:116%;font-size:82px;letter-spacing:-.015em;line-height:1.02;color:var(--ink);max-width:1000px}

/* svg drawing */
.art .ln{stroke:var(--line);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.art .ln2{stroke:var(--line2);stroke-width:2.2;fill:none}
.art .dashl{stroke-dasharray:7 9}
.art .obj{fill:#111117;stroke:#a19faa;stroke-width:3}
.art .spr{fill:none;stroke:#cfcdd8;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.art .hatch{stroke:var(--line2);stroke-width:2}
.art text{font-family:var(--f-math);font-size:30px;fill:var(--ink)}
.art .lab{font-style:italic}
.art .sm{font-family:var(--f-body);font-size:22px;fill:var(--dim)}
.art .smacc{font-family:var(--f-body);font-size:22px;fill:var(--acc)}
.art .arr line{stroke:currentColor;stroke-width:4.5;stroke-linecap:round}
.art .arr polygon{fill:currentColor}
.art .arr text{fill:currentColor;font-style:italic;font-size:29px;paint-order:stroke;stroke:#060608;stroke-width:6px}
.art .dim line{stroke:var(--dim);stroke-width:1.6}
.art .dim text{fill:var(--dim);font-size:25px;font-style:italic;paint-order:stroke;stroke:#060608;stroke-width:6px}
.art .ang path{fill:none;stroke:var(--acc);stroke-width:2.2}
.art .ang text{fill:var(--acc);font-size:26px;font-style:italic}
.art .dot{fill:var(--ink)}

/* bars (energy diagrams) */
.bars{position:absolute;width:210px;font-family:var(--f-math)}
.btl{font-family:var(--f-disp);font-weight:800;font-stretch:110%;font-size:26px;text-align:center;margin-bottom:6px;color:var(--ink)}
.bcols{height:200px;display:flex;align-items:flex-end;justify-content:center;gap:12px;border-bottom:2px solid var(--line)}
.bc{width:50px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bf{width:100%;height:calc(var(--h,0) * 100%);border-radius:4px 4px 0 0;transition:height 1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 26px -6px currentColor}
.bv{font-size:20px;color:var(--ink);margin-bottom:4px;white-space:nowrap;min-height:24px}
.bls{display:flex;justify-content:center;gap:12px;margin-top:6px}
.bls span{width:50px;text-align:center;font-style:italic;font-size:23px;color:var(--dim)}
.bls sub{font-size:.62em;font-style:normal}
.be{text-align:center;font-size:21px;margin-top:4px;color:var(--ink);min-height:28px;white-space:nowrap}
.be i{font-style:italic}.be sub{font-size:.6em;font-style:normal}.be sup{font-size:.6em}
.bars.sm .bcols{height:130px}.bars.sm .bc{width:42px}.bars.sm .bls span{width:42px}.bars.sm .btl{font-size:22px}

/* beat-driven visibility */
.scene [data-b]{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .4s ease,color .4s ease}
.scene [data-b].vis{opacity:1;transform:none}
.scene .draw[data-b]{opacity:1;transform:none;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s cubic-bezier(.6,0,.2,1),opacity .5s ease}
.scene .draw[data-b].vis{stroke-dashoffset:0}
.scene .gone,.scene .draw.gone{opacity:0!important}
.scene g.hl,.scene .node.hl,.scene .pill.hl{filter:drop-shadow(0 0 12px rgba(180,140,255,.8))}
@media (prefers-reduced-motion:reduce){
  #stage{animation:none}
  .scene,.scene [data-b]{transition-duration:.01s!important}
}
@media (max-width:560px){
  #cap{padding:12px 14px 14px}
  #chName{display:none}
}
</style>

<div class="wrap">

<script>
/* ================= helpers: math text ================= */
function fr(a,b){return `<span class="fr"><span>${a}</span><span>${b}</span></span>`}
function rt(x){return `<span class="rt">√<span class="rad">${x}</span></span>`}
function M(s){
  s=s.replace(/ ([<>])(?=[ =])/g,(_,c)=>' '+(c=='<'?'&lt;':'&gt;')).replace(/ {2,}/g,m=>'\u2002'.repeat(Math.max(1,m.length>>1)));

loop(st,r){const ns=[4,6,8,12,16,24,32,48],k=Math.floor(st/1.6)%ns.length,n=ns[k];if(r._n!==n){r._n=n;setD(r,'i_rc',rectsD(g,f,0,4.2,n,'M'));setTx(r,'i_n',String(n))}}
});}

`Primero, el mapa. La materia tiene tres bloques. El primero, a la izquierda, es aprender a calcular integrales: qué es una antiderivada, la tabla básica, y los tres métodos grandes: sustitución, integración por partes y fracciones parciales.`,

/* ===================== ANTIDERIVADAS ===================== */
CH('Antiderivadas','Clase 8','Capítulo uno: antiderivadas. Es la derivada, pero jugada al revés.');

S({title:'El problema al revés',
html:`
${node(110,200,300,'F(x) = x²','{{la función}}',0)}
${node(760,200,300,'f(x) = 2x','{{su derivada}}',0,'acc')}
${svg(`${arr(420,232,748,232,'f2','',0)}${tc(584,205,'derivar','f2',0,'middle',24)}
${arr(748,282,420,282,'f3','',1)}${tc(584,310,'antiderivar','f3',1,'middle',24)}`)}
${N(90,380,1100,'<b>Antes:</b> dada <i>F</i>, encontrar <i>F</i> ′. &nbsp;&nbsp;<b>Ahora:</b> dada <i>f</i>, encontrar una <i>F</i> tal que <i>F</i> ′ = <i>f</i>.',1)}
${Q(90,470,'F′(x) = f(x)   {{para todo}} x ∈ I',2,'box')}
${N(600,470,600,'<i>F</i> es una <b>antiderivada</b> o <b>primitiva</b> de <i>f</i>. Debe ser <b>continua</b>, y se permite que falle en un número finito de puntos.',2)}
${N(90,590,1100,'¿Cómo se comprueba? <b>Derivando</b> la respuesta: tiene que salir <i>f</i>.',3)}`,
beats:[
`Hasta ahora sabías resolver este problema: te dan una función, por ejemplo F de x igual a x al cuadrado, y tú la derivas. La derivada es 2 x.`,
`Ahora vamos a resolver el problema al revés. Te dan la derivada, 2 x, y te preguntan: ¿qué función, al derivarla, da 2 x? La respuesta es x al cuadrado. Eso se llama antiderivar, y la teoría que estudia este problema se llama cálculo integral.`,
`La definición formal es esta: F es una antiderivada, o primitiva, de f en un intervalo I, si F es continua y F prima de x es igual a f de x para todo x de I. Se permite que la igualdad falle en un número finito de puntos, por ejemplo en las uniones de una función por tramos. Pero F tiene que ser continua siempre.`,
`Y lo mejor de todo: un ejercicio de antiderivadas siempre se puede comprobar. Derivas tu respuesta, y si te da la función original, está bien. Hazlo siempre en el certamen, toma diez segundos y te salva puntos.`]
});

{const g=G(330,600,85,48);
S({title:'No hay una sola: la constante C',
html:`${svg(`
${axes(g,-2.6,2.6,-0.3,8.6,0,{xl:'x',yl:false})}
${[-1,0,1.5,3,4.5].map((c,i)=>cv(g,x=>x*x+c+1,-2.4,2.4,i===1?'f1':'line',0,{w:i===1?4:2.5,lim:8.5})).join('')}
<g data-b="1">${[-1,0,1.5,3,4.5].map((c,i)=>`<line id="tg${i}" class="ln2" style="stroke:var(--f5);stroke-width:3"/>`).join('')}</g>
`)}
${Q(650,185,'(x^2 + C)′ = 2x',0,'s')}
${N(650,245,560,'Sumar una constante <b>no cambia</b> la derivada: todas estas curvas tienen la misma pendiente en cada <i>x</i>.',1)}
${N(650,370,560,'<b>Al revés también:</b> si <i>F</i> ′ = <i>G</i> ′ en un intervalo, entonces <i>F</i> = <i>G</i> + <i>C</i>.',2)}
${Q(650,470,`sen(2x):     F_1 = −${fr('cos(2x)','2')},     F_2 = sen^2 x`,3,'xs')}
${Q(650,560,`F_2 = ${fr('1 − cos(2x)','2')} = F_1 + ${fr('1','2')}`,3,'xs')}`,
beats:[
`Ahora, un detalle muy importante. x al cuadrado tiene derivada 2 x. Pero x al cuadrado más 5 también, porque la derivada de una constante es cero. Y x al cuadrado menos 3, también. Hay infinitas antiderivadas.`,
`Mira el dibujo: todas estas parábolas son la misma curva subida o bajada. Y en cada x, sus rectas tangentes son paralelas: tienen la misma pendiente. Por eso todas tienen la misma derivada.`,
`Y vale lo contrario, que se vio en la clase 5: si dos funciones tienen la misma derivada en un intervalo, entonces difieren en una constante. O sea, F es igual a G más C. Esto es lo que nos asegura que no hay más antiderivadas que esas: basta encontrar una, y las demás son esa más una constante.`,
`Un ejemplo de la clase que confunde: para seno de 2 x, menos coseno de 2 x partido en 2 es una antiderivada, y seno al cuadrado de x es otra. Parecen muy distintas, pero usando la identidad seno cuadrado igual a, uno menos coseno de 2 x, partido en 2, ves que seno cuadrado es F uno más un medio. Difieren en una constante. Por eso dos personas pueden obtener respuestas que se ven distintas, y estar ambas bien.`],
loop(st,r){const x0=1.6*Math.sin(st*.7);[-1,0,1.5,3,4.5].forEach((c,i)=>{const y0=x0*x0+c+1,m=2*x0,h=.45;setL(r,'tg'+i,g.X(x0-h),g.Y(y0-m*h),g.X(x0+h),g.Y(y0+m*h))})}
});}

S({title:'La integral indefinida',
html:`
${Q(640,185,`${I()} f(x) dx = F(x) + C`,0,'l c box')}
${P(150,285,'∫ símbolo','f2',1,'nc')}${P(370,285,'f(x) integrando','f1',1,'nc')}${P(650,285,'dx variable','f5',1,'nc')}${P(880,285,'C constante','f4',1,'nc')}
${N(90,395,1100,'Es el <b>conjunto</b> de todas las antiderivadas de <i>f</i>. Por eso el <b>+ <i>C</i></b> no es opcional.',2)}
${P(90,470,'Linealidad','acc',3)}
${Q(90,520,`${I()} (f + g) dx = ${I()} f dx + ${I()} g dx`,3,'s')}
${Q(700,520,`${I()} α f dx = α ${I()} f dx`,3,'s')}
${N(90,600,1100,'<b>Ojo:</b> no hay regla para el producto. ∫ <i>f</i> · <i>g</i> d<i>x</i> <b>no</b> es (∫ <i>f</i>)(∫ <i>g</i>).',4)}`,
beats:[
`Para anotar todas las antiderivadas a la vez se usa la integral indefinida. Se escribe así: integral de f de x, d x, igual a F de x más C.`,
`Cada parte tiene nombre. La ese alargada es el símbolo de integral. Lo de adentro, f de x, es el integrando: la función que estamos integrando. El d x indica cuál es la variable. Y C es la constante de integración, que representa cualquier número real.`,
`La integral indefinida es el conjunto de todas las antiderivadas de f. Por eso el más C no es opcional: si no lo escribes, estás dando solo una antiderivada y no todas. En el certamen te pueden descontar por eso.`,
`La primera propiedad es la linealidad. La integral de una suma es la suma de las integrales. Y las constantes que multiplican pueden salir afuera de la integral. Con esto, cualquier polinomio se integra término a término.`,
`Pero ojo, que esto es un error clásico: no existe una regla del producto para integrales. La integral de f por g no es la integral de f por la integral de g. Para productos vamos a necesitar métodos: sustitución o integración por partes.`]
});

S({title:'La tabla básica',
html:`
${TB(90,170,[520],[{h:1,c:['Potencias, log y exp'],b:0},{c:[`${I()} dx = x + C`],b:0},{c:[`${I()} x^{n} dx = ${fr('x^{n+1}','n + 1')} + C   {{si}} n ≠ −1`],b:1},{c:[`${I()} ${fr('1','x')} dx = ln|x| + C`],b:1},{c:[`${I()} e^{x} dx = e^{x} + C`],b:1}])}
${TB(660,170,[530],[{h:1,c:['Trigonométricas'],b:2},{c:[`${I()} sen x dx = −cos x + C`],b:2},{c:[`${I()} cos x dx = sen x + C`],b:2},{c:[`${I()} sec^2 x dx = tan x + C`],b:2},{c:[`${I()} sec x tan x dx = sec x + C`],b:2},{c:[`${I()} ${fr('1',rt('1 − x^2'))} dx = arcsen x + C`],b:3},{c:[`${I()} ${fr('1','1 + x^2')} dx = arctan x + C`],b:3}])}
${N(90,560,520,'Cada fila se comprueba <b>derivando</b> el lado derecho.',4)}`,
beats:[
`Para integrar necesitamos una tabla de antiderivadas básicas, igual que para derivar tenías una tabla de derivadas. La buena noticia: no es nada nuevo. Cada fila es una derivada que ya conoces, leída al revés.`,
`Las primeras. La integral de d x es x más C. La integral de x a la n es x a la n más 1, dividido por n más 1, más C. Ojo: esto vale para todo n distinto de menos 1, porque si n fuera menos 1 dividiríamos por cero. Justamente el caso n igual a menos 1, la integral de uno partido por x, da logaritmo natural del valor absoluto de x. Y la integral de e a la x es e a la x.`,
`Las trigonométricas: la integral de seno es menos coseno, porque la derivada de coseno es menos seno. La integral de coseno es seno. La de secante al cuadrado es tangente. Y la de secante por tangente es secante.`,
`Y dos que vienen de las derivadas de las funciones inversas, que viste en la clase 3: la integral de uno partido por raíz de, 1 menos x al cuadrado, es arcoseno de x. Y la integral de uno partido por, 1 más x al cuadrado, es arcotangente de x.`,
`Repito el consejo: no hay que creerle a la tabla. Cada fila se comprueba derivando el lado derecho. Por ejemplo, derivas x al cubo partido en 3, y te da 3 x al cuadrado partido en 3, o sea x al cuadrado. Funciona.`]
});

S({title:'Ejemplo 1: arreglar antes de integrar',
html:`
${Q(90,175,`${I()} ${fr('3x + 2'+rt('x'),'x'+rt('x'))} dx`,0,'')}
${N(520,190,680,'Primero <b>separamos</b> la fracción y escribimos todo como potencias de <i>x</i>.',0)}
${Q(90,300,`x${rt('x')} = x · x^{1/2} = x^{3/2}`,1,'s')}
${Q(90,380,`${fr('3x','x^{3/2}')} = 3x^{−1/2},        ${fr('2x^{1/2}','x^{3/2}')} = 2x^{−1} = ${fr('2','x')}`,2,'s')}
${Q(90,490,`${I()} (3x^{−1/2} + ${fr('2','x')}) dx = 3 · ${fr('x^{1/2}','1/2')} + 2 ln|x| + C`,3,'s')}
${Q(90,590,`= 6${rt('x')} + 2 ln x + C`,4,'s box')}
${N(560,600,640,'(aquí <i>x</i> > 0, por la raíz, así que |<i>x</i>| = <i>x</i>)',4)}`,
beats:[
`Vamos con los ejemplos de la clase. El primero: la integral de, 3 x más 2 raíz de x, dividido por, x raíz de x. No hay fórmula para un cociente, así que primero hay que arreglar la expresión: separar la fracción en dos, y escribir todo como potencias de x.`,
`El denominador: x por raíz de x. La raíz de x es x a la un medio, y al multiplicar potencias de igual base se suman los exponentes: 1 más un medio es tres medios. Entonces el denominador es x a la tres medios.`,
`Ahora separamos. Primer término: 3 x partido por x a la tres medios. Al dividir se restan exponentes: 1 menos tres medios es menos un medio. Queda 3 x a la menos un medio. Segundo término: 2 x a la un medio, partido por x a la tres medios. Un medio menos tres medios es menos 1. Queda 2 x a la menos 1, o sea, 2 partido por x.`,
`Ahora sí integramos término a término con la tabla. Para 3 x a la menos un medio usamos la regla de la potencia: el exponente sube en uno, de menos un medio a un medio, y dividimos por ese nuevo exponente, un medio. Para 2 partido por x usamos el logaritmo: 2 por logaritmo del valor absoluto de x.`,
`Simplificando: 3 dividido por un medio es 6, y x a la un medio es raíz de x. Queda 6 raíz de x más 2 logaritmo de x, más C. Como la raíz obliga a que x sea positivo, el valor absoluto se puede sacar. Compruébalo derivando: la derivada de 6 raíz de x es 3 partido por raíz de x, y la de 2 logaritmo de x es 2 partido por x. Sumadas, dan la función original.`]
});

S({title:'Ejemplos 2 y 3: usar identidades',
html:`
${Q(90,170,`${I()} cos^2 x dx = ${I()} ${fr('1 + cos(2x)','2')} dx = ${fr('x','2')} + ${fr('sen(2x)','4')} + C`,0,'s')}
${N(90,250,1100,'Truco: <b>cos² <i>x</i> = (1 + cos 2<i>x</i>)/2</b> &nbsp;y&nbsp; <b>sen² <i>x</i> = (1 − cos 2<i>x</i>)/2</b>. Y (sen 2<i>x</i>)′ = 2 cos 2<i>x</i>, por eso aparece el 4.',1)}
${svg(ln(90,340,1190,340,2,'ln2'))}
${Q(90,360,`${I()} ${fr('(1 + sen x)^2','cos^2 x')} dx = ${I()} ${fr('1 + 2 sen x + sen^2 x','cos^2 x')} dx`,2,'s')}
${Q(90,455,`= ${I()} (sec^2 x + 2 sec x tan x + tan^2 x) dx`,3,'s')}
${Q(90,532,`tan^2 x = sec^2 x − 1  ⇒  ${I()} (2 sec^2 x + 2 sec x tan x − 1) dx`,4,'s')}
${Q(90,610,'= 2 tan x + 2 sec x − x + C',5,'s box')}`,
beats:[
`Ejemplo 2: la integral de coseno al cuadrado de x. Coseno al cuadrado no está en la tabla. La clave es una identidad que vas a usar muchísimo en este certamen: coseno al cuadrado de x es igual a, 1 más coseno de 2 x, partido en 2. Con eso, la integral se separa en la integral de un medio, que da x medios, más la integral de coseno de 2 x partido en 2.`,
`¿Y por qué la integral de coseno de 2 x es seno de 2 x partido en 2? Porque al derivar seno de 2 x, la regla de la cadena saca un 2 afuera: da 2 coseno de 2 x. Para compensar ese 2, dividimos por 2. Junto con el un medio que ya teníamos, queda seno de 2 x partido en 4. Memoriza también la otra: seno al cuadrado es, 1 menos coseno de 2 x, partido en 2.`,
`Ejemplo 3: la integral de, 1 más seno de x, al cuadrado, partido por coseno al cuadrado. Primero desarrollamos el cuadrado de binomio de arriba: 1 más 2 seno de x más seno al cuadrado.`,
`Ahora dividimos cada término por coseno al cuadrado. 1 partido por coseno al cuadrado es secante al cuadrado. 2 seno partido por coseno al cuadrado se puede ver como 2 por, 1 partido por coseno, por, seno partido por coseno: o sea 2 secante por tangente. Y seno al cuadrado partido por coseno al cuadrado es tangente al cuadrado.`,
`Tangente al cuadrado no está en la tabla, pero por la identidad pitagórica, tangente al cuadrado es secante al cuadrado menos 1. Reemplazando, quedan 2 secantes al cuadrado, más 2 secante tangente, menos 1. Y todo eso sí está en la tabla.`,
`Integramos: 2 secante al cuadrado da 2 tangente. 2 secante tangente da 2 secante. Y menos 1 da menos x. Resultado: 2 tangente de x, más 2 secante de x, menos x, más C.`]
});

S({title:'Ejemplo 4: dividir polinomios',
html:`
${Q(90,180,`${I()} ${fr('x^3 + x + 1','x^2 + 1')} dx`,0,'')}
${N(520,190,680,'Arriba el grado es mayor o igual que abajo: <b>primero se divide</b>.',0)}
${Q(90,310,'x^3 + x = x(x^2 + 1)',1,'s')}
${Q(90,390,`${fr('x^3 + x + 1','x^2 + 1')} = ${fr('x(x^2 + 1)','x^2 + 1')} + ${fr('1','x^2 + 1')} = x + ${fr('1','x^2 + 1')}`,2,'s')}
${Q(90,510,`${I()} (x + ${fr('1','x^2 + 1')}) dx = ${fr('x^2','2')} + arctan x + C`,3,'s box')}`,
beats:[
`Ejemplo 4: la integral de, x al cubo más x más 1, partido por, x al cuadrado más 1. Cuando el grado del numerador es mayor o igual al del denominador, lo primero que hay que hacer es dividir los polinomios. Esto vuelve en fracciones parciales, así que conviene acostumbrarse.`,
`Aquí la división es fácil si te fijas: x al cubo más x tiene a x como factor común, y queda x por, x al cuadrado más 1. Justo el denominador.`,
`Entonces separamos: x por, x al cuadrado más 1, partido por, x al cuadrado más 1, se simplifica y queda x. Y sobra 1 partido por, x al cuadrado más 1. En total: x más, 1 partido por x al cuadrado más 1.`,
`Ahora es directo con la tabla: la integral de x es x al cuadrado partido en 2, y la integral de 1 partido por, 1 más x al cuadrado, es arcotangente de x. Respuesta: x al cuadrado medios, más arcotangente de x, más C.`]
});

{const g=G(880,470,88,56),F1=x=>x*x+x,F2=x=>x*x*x/3-3*x;
S({title:'Antiderivada de una función por tramos',
html:`
${Q(90,170,`f(x) = ${cs([['2x + 1','x ≤ 0'],['x^2 − 3','x > 0']])}`,0,'s')}
${Q(90,290,'x ≤ 0:   F(x) = x^2 + x + C_1',1,'s')}
${Q(90,350,`x > 0:   F(x) = ${fr('x^3','3')} − 3x + C_2`,1,'s')}
${N(90,430,560,'<i>F</i> debe ser <b>continua</b> en <i>x</i> = 0: los dos tramos tienen que llegar a la misma altura.',2)}
${Q(90,530,'0 + 0 + C_1 = 0 − 0 + C_2  ⇒  C_1 = C_2',3,'s')}
${Q(90,600,`F(x) = ${cs([['x^2 + x','x ≤ 0'],[fr('x^3','3')+' − 3x','x > 0']])} + C`,4,'xs box')}
${svg(`${axes(g,-1.9,3.6,-3.6,3.2,2,{xt:[[-1,'−1'],[3,'3']],yt:[]})}
${cv(g,F1,-1.8,0,'f2',2,{lim:3.1})}${cv(g,F2,0,3.4,'f1',2,{lim:3.6})}${fdot(g.X(0),g.Y(0),'f5',3,8)}${tc(g.X(0)+16,g.Y(0)-24,'se unen','f5',3,'start',22)}`)}`,
beats:[
`Un ejemplo de la clase con funciones por tramos. f de x es 2 x más 1 si x es menor o igual a cero, y x al cuadrado menos 3 si x es mayor que cero. Queremos una antiderivada.`,
`Se integra cada tramo por separado. Para x menor o igual a cero: la integral de 2 x más 1 es x al cuadrado más x, más una constante C uno. Para x mayor que cero: la integral de x al cuadrado menos 3 es x al cubo tercios menos 3 x, más otra constante C dos. Ojo: cada tramo tiene su propia constante.`,
`Ahora lo importante: la definición pide que la antiderivada sea continua. Así que los dos tramos tienen que juntarse en x igual a cero. En el dibujo, el pedazo celeste y el morado tienen que llegar al mismo punto.`,
`Evaluamos ambos tramos en x igual a cero. El primero da 0 más 0 más C uno. El segundo da 0 menos 0 más C dos. Para que sean iguales, C uno tiene que ser igual a C dos. Aquí tuvimos suerte y las constantes son iguales, pero en otros ejercicios no. Por ejemplo, en el ejercicio de la clase con los tramos 1, x y x al cuadrado, al pegar en x igual a 1 y en x igual a 2 te salen constantes un medio y menos un sexto. Hazlo como práctica.`,
`Resultado: F de x es x al cuadrado más x si x es menor o igual a cero, y x al cubo tercios menos 3 x si x es mayor que cero, todo más una sola constante C. El método general: integra cada tramo, y después ajusta las constantes para que F quede continua en cada punto de unión.`]
});}

/* ===================== SUSTITUCIÓN ===================== */
CH('Sustitución','Clase 9','Capítulo dos: el método de sustitución. Es la regla de la cadena, leída al revés.');

S({title:'La regla de la cadena al revés',
html:`
${Q(90,180,'(F(g(x)))′ = F′(g(x)) · g′(x)',0,'s')}
${N(700,188,500,'Regla de la cadena, del certamen 1.',0)}
${Q(90,270,`${I()} f(g(x)) · g′(x) dx = F(g(x)) + C`,1,'s')}
${P(90,370,'Cambio de variable','acc',2)}
${Q(380,362,'u = g(x)     du = g′(x) dx',2,'s')}
${Q(90,460,`${I()} f(g(x)) · g′(x) dx = ${I()} f(u) du`,3,'box')}
${N(90,570,1100,'Lo que hay que reconocer: <b>una función de algo</b>, multiplicada por <b>la derivada de ese algo</b>.',4)}`,
beats:[
`El método de sustitución sale de la regla de la cadena. Recuerda: la derivada de F de g de x, es F prima de g de x, por g prima de x. La derivada de afuera evaluada en lo de adentro, por la derivada de lo de adentro.`,
`Si leemos eso al revés, dice: la integral de F prima de g de x, por g prima de x, es F de g de x más C. Llamando f a F prima: la integral de f de g de x por g prima de x, es F de g de x, más C.`,
`Para que esto sea fácil de usar, hacemos un cambio de variable. Llamamos u a lo de adentro: u igual a g de x. Entonces d u es g prima de x por d x. Esa es la forma de anotar la derivada de u multiplicada por d x.`,
`Con esos dos reemplazos, la integral complicada en x se transforma en una integral sencilla en u: la integral de f de u, d u. Ese es el teorema de sustitución simple.`,
`La habilidad que hay que entrenar es reconocer el patrón: una función de algo, multiplicada por la derivada de ese algo. Puede que la derivada aparezca multiplicada por una constante; eso se arregla fácil, como vas a ver.`]
});

S({title:'El método en cuatro pasos',
html:`
${LI(90,180,1,'<b>Elige <i>u</i>:</b> lo de adentro, o lo que tenga su derivada multiplicando afuera.',0)}
${LI(90,262,2,'<b>Calcula d<i>u</i></b> = <i>u</i> ′ d<i>x</i>, y despeja lo que necesites: d<i>x</i>, o un grupo como <i>x</i> d<i>x</i>.',1)}
${LI(90,344,3,'<b>Reemplaza todo.</b> Si queda alguna <i>x</i> suelta, la <i>u</i> no sirvió: prueba otra.',2)}
${LI(90,426,4,'<b>Integra en <i>u</i></b> y vuelve a <i>x</i> reemplazando <i>u</i> = <i>g</i>(<i>x</i>).',3)}
${Q(90,525,`${I()} cos(5x) dx:    u = 5x,  du = 5 dx  ⇒  dx = ${fr('du','5')}`,4,'s')}
${Q(90,600,`${I()} cos u ${fr('du','5')} = ${fr('sen u','5')} + C = ${fr('sen(5x)','5')} + C`,4,'s')}`,
beats:[
`El método en cuatro pasos. Paso uno: elegir u. Normalmente es lo que está adentro de otra función, como lo de adentro de una raíz, un seno o un logaritmo; o algo cuya derivada aparece multiplicando.`,
`Paso dos: calcular d u. Derivas u, y multiplicas por d x. Después despejas lo que te sirva: d x solo, o un grupo, por ejemplo x d x.`,
`Paso tres: reemplazar todo en la integral. Al final de este paso no puede quedar ninguna x. Si queda una x suelta que no logras escribir en función de u, esa u no era la buena, y hay que probar otra.`,
`Paso cuatro: integrar en u con la tabla, y al final devolver todo a x, reemplazando u por lo que era. La respuesta siempre se entrega en la variable original.`,
`Un ejemplo rápido: la integral de coseno de 5 x. Tomamos u igual a 5 x. Entonces d u es 5 d x, y despejando, d x es d u partido en 5. Reemplazamos: la integral de coseno de u, por d u quintos. Eso da seno de u partido en 5. Y volviendo a x: seno de 5 x, partido en 5, más C. Fíjate que el 5 de la derivada se arregló dividiendo.`]
});

S({title:'Ejemplo: la integral de tan x',
html:`
${Q(90,180,`${I()} tan x dx = ${I()} ${fr('sen x','cos x')} dx`,0,'')}
${N(640,195,560,'La derivada de cos <i>x</i> es −sen <i>x</i>, y sen <i>x</i> está arriba.',1)}
${Q(90,310,'u = cos x     du = −sen x dx  ⇒  sen x dx = −du',1,'s')}
${Q(90,400,`${I()} ${fr('sen x dx','cos x')} = ${I()} ${fr('−du','u')} = −ln|u| + C`,2,'s')}
${Q(90,505,'= −ln|cos x| + C = ln|sec x| + C',3,'s box')}
${N(90,590,1100,'Comprueba: (−ln|cos <i>x</i>|)′ = −(−sen <i>x</i>)/cos <i>x</i> = tan <i>x</i>. ✓',4)}`,
beats:[
`Ejemplo de la clase: la integral de tangente de x. Tangente no está en la tabla. Pero tangente es seno partido por coseno.`,
`Ahora fíjate: la derivada del coseno es menos seno, y el seno está justo arriba. Eso es la señal: u igual a coseno de x. Entonces d u es menos seno de x d x, o sea, seno de x d x es igual a menos d u.`,
`Reemplazamos: arriba, seno de x d x se transforma en menos d u, y abajo, coseno de x es u. Queda la integral de menos d u partido por u. Y la integral de 1 partido por u es logaritmo del valor absoluto de u. Con el signo: menos logaritmo del valor absoluto de u, más C.`,
`Volvemos a x: menos logaritmo del valor absoluto del coseno de x, más C. Por propiedades del logaritmo, menos logaritmo de coseno es logaritmo de 1 partido por coseno, o sea logaritmo del valor absoluto de la secante. Las dos formas son correctas.`,
`Y comprobamos derivando: la derivada de menos logaritmo de coseno es menos, la derivada de coseno partido por coseno. O sea, menos, menos seno partido por coseno. Eso es tangente. Funciona.`]
});

S({title:'Ejemplos: logaritmos y arcoseno',
html:`
${Q(90,170,`${I()} ${fr('dx','x ln'+rt('x'))}`,0,'s')}
${Q(340,178,`ln${rt('x')} = ${fr('1','2')} ln x  ⇒  ${I()} ${fr('2 dx','x ln x')}`,0,'s')}
${Q(90,275,`u = ln x,   du = ${fr('dx','x')}  ⇒  ${I()} ${fr('2 du','u')} = 2 ln|u| + C = 2 ln|ln x| + C`,1,'s')}
${svg(ln(90,370,1190,370,2,'ln2'))}
${Q(90,395,`${I()} ${fr(rt('arcsen x'),rt('1 − x^2'))} dx`,2,'s')}
${Q(90,505,`u = arcsen x,     du = ${fr('dx',rt('1 − x^2'))}`,3,'s')}
${Q(90,595,`${I()} ${rt('u')} du = ${fr('u^{3/2}','3/2')} + C = ${fr('2','3')} (arcsen x)^{3/2} + C`,4,'s box')}`,
beats:[
`Dos ejemplos más de la clase. Primero: la integral de d x partido por, x por logaritmo de raíz de x. Antes de sustituir, simplificamos: logaritmo de raíz de x es un medio logaritmo de x, porque la raíz es potencia un medio y el exponente baja multiplicando. Entonces la integral queda: 2 d x partido por, x logaritmo de x.`,
`Ahora vemos el patrón: la derivada de logaritmo de x es 1 partido por x, y d x partido por x está ahí. Tomamos u igual a logaritmo de x, d u igual a d x partido por x. La integral queda 2 por la integral de d u partido por u, que es 2 logaritmo del valor absoluto de u. Volviendo: 2 logaritmo del valor absoluto del logaritmo de x, más C.`,
`Segundo ejemplo: la integral de raíz de arcoseno de x, partido por raíz de, 1 menos x al cuadrado. Se ve feo, pero mira bien.`,
`La derivada del arcoseno es justamente 1 partido por raíz de 1 menos x al cuadrado. Entonces u igual a arcoseno de x, y d u igual a d x partido por raíz de 1 menos x al cuadrado. Toda la fracción se transforma en raíz de u por d u.`,
`Raíz de u es u a la un medio. Su integral es u a la tres medios partido por tres medios, o sea dos tercios de u a la tres medios. Volviendo a x: dos tercios por, arcoseno de x elevado a tres medios, más C.`]
});

S({title:'Dos ejercicios propuestos de la clase',
html:`
${Q(90,175,`${I()} sen^3 x cos^3 x dx`,0,'s')}
${Q(450,175,'cos^3 x = cos^2 x · cos x = (1 − sen^2 x) cos x',1,'s')}
${Q(90,260,`u = sen x, du = cos x dx  ⇒  ${I()} u^3 (1 − u^2) du = ${I()} (u^3 − u^5) du`,2,'s')}
${Q(90,345,`= ${fr('sen^4 x','4')} − ${fr('sen^6 x','6')} + C`,3,'s box')}
${svg(ln(90,440,1190,440,4,'ln2'))}
${Q(90,465,`${I()} ${fr('ln^3 x','x')} dx:    u = ln x,  du = ${fr('dx','x')}  ⇒  ${I()} u^3 du = ${fr('ln^4 x','4')} + C`,4,'s')}
${N(90,585,1100,'Con potencias de seno y coseno: si una es <b>impar</b>, guarda un factor para el d<i>u</i> y convierte el resto con sen² + cos² = 1.',5)}`,
beats:[
`Dos ejercicios propuestos de la clase 9 para que practiques. El primero: la integral de seno al cubo por coseno al cubo. Si tomo u igual a seno, necesito un coseno para el d u. Y si tomo u igual a coseno, necesito un seno.`,
`El truco: separar un coseno. Coseno al cubo es coseno al cuadrado por coseno. Y coseno al cuadrado, por la identidad pitagórica, es 1 menos seno al cuadrado. Entonces todo queda en senos, salvo un coseno solito.`,
`Ahora sí: u igual a seno de x, d u igual a coseno de x d x. El coseno solito se va con el d x. Queda la integral de u al cubo por, 1 menos u al cuadrado, d u. Multiplicando: u al cubo menos u a la quinta.`,
`Integramos con la regla de la potencia: u a la cuarta partido en 4, menos u a la sexta partido en 6. Volviendo a x: seno a la cuarta partido en 4, menos seno a la sexta partido en 6, más C.`,
`El segundo es más corto: la integral de logaritmo al cubo de x, partido por x. De nuevo, d x partido por x es la derivada del logaritmo. Con u igual a logaritmo de x, queda la integral de u al cubo, que es u a la cuarta partido en 4. Respuesta: logaritmo a la cuarta de x, partido en 4, más C.`,
`La regla general que sale de aquí: en integrales con potencias de seno y coseno, si alguna de las potencias es impar, guarda un factor de esa función para el d u, y transforma el resto usando seno cuadrado más coseno cuadrado igual a 1.`]
});

/* ===================== SUSTITUCIÓN TRIGONOMÉTRICA ===================== */
CH('Sustitución trigonométrica','Clase 9','Capítulo tres: sustitución trigonométrica. Sirve para deshacerse de raíces cuadradas con una identidad.');

S({title:'Para sacarse la raíz de encima',
html:`
${TB(90,175,[260,400,380],[{h:1,c:['Si aparece','Sustitución','Identidad'],b:0},{c:[rt('a^2 − x^2'),'x = a sen θ,  θ ∈ [−π/2, π/2]','1 − sen^2 θ = cos^2 θ'],b:1},{c:[rt('a^2 + x^2'),'x = a tan θ,  θ ∈ ]−π/2, π/2[','1 + tan^2 θ = sec^2 θ'],b:2},{c:[rt('x^2 − a^2'),'x = a sec θ,  θ ∈ [0, π/2[','sec^2 θ − 1 = tan^2 θ'],b:3}])}
${Q(90,470,`${rt('a^2 − a^2 sen^2 θ')} = ${rt('a^2 cos^2 θ')} = a cos θ`,4,'s')}
${N(760,478,440,'(cos θ ≥ 0 en ese intervalo, así que no hay valor absoluto)',4)}
${N(90,570,1100,'Después de integrar en θ, se vuelve a <i>x</i> con un <b>triángulo rectángulo</b>.',5)}`,
beats:[
`Ahora, la sustitución trigonométrica. Sirve para integrales que tienen una raíz cuadrada de una de estas tres formas: a al cuadrado menos x al cuadrado, a al cuadrado más x al cuadrado, o x al cuadrado menos a al cuadrado. La idea es reemplazar x por una función trigonométrica, de modo que lo de adentro de la raíz se transforme en un cuadrado perfecto gracias a una identidad.`,
`Caso uno: si aparece raíz de a cuadrado menos x cuadrado, se usa x igual a a seno de theta, con theta entre menos pi medios y pi medios. La identidad que se usa es: 1 menos seno cuadrado es coseno cuadrado.`,
`Caso dos: si aparece raíz de a cuadrado más x cuadrado, se usa x igual a a tangente de theta. La identidad: 1 más tangente cuadrado es secante cuadrado.`,
`Caso tres: si aparece raíz de x cuadrado menos a cuadrado, se usa x igual a a secante de theta. Y la identidad: secante cuadrado menos 1 es tangente cuadrado.`,
`Mira cómo funciona el primer caso: con x igual a a seno theta, lo de adentro es a cuadrado menos a cuadrado seno cuadrado. Factorizando a cuadrado, queda a cuadrado por, 1 menos seno cuadrado, que es a cuadrado coseno cuadrado. Y la raíz de eso es a coseno de theta, sin valor absoluto, porque en el intervalo elegido el coseno es positivo. La raíz desapareció.`,
`Al final, la respuesta está en theta, y hay que devolverla a x. Para eso se dibuja un triángulo rectángulo. Lo vemos en los ejemplos.`]
});

S({title:'Ejemplo: 2 dx sobre raíz de 1 − 4x²',
html:`
${Q(90,175,`${I()} ${fr('2 dx',rt('1 − 4x^2'))} = ${I()} ${fr('2 dx',rt('1 − (2x)^2'))}`,0,'s')}
${Q(90,290,`2x = sen θ  ⇒  x = ${fr('sen θ','2')},    dx = ${fr('cos θ','2')} dθ`,1,'s')}
${Q(90,390,`${rt('1 − sen^2 θ')} = cos θ`,2,'s')}
${Q(90,470,`${I()} ${fr('2 · (cos θ / 2)','cos θ')} dθ = ${I()} dθ = θ + C`,3,'s')}
${Q(90,575,'= arcsen(2x) + C',4,'s box')}
${N(560,585,640,'(también sale con la tabla: <i>u</i> = 2<i>x</i>)',4)}`,
beats:[
`Primer ejemplo de la clase: la integral de 2 d x partido por raíz de, 1 menos 4 x al cuadrado. Lo primero es escribirlo con la forma de la tabla. 4 x al cuadrado es, 2 x, al cuadrado. Entonces es raíz de 1 menos, 2 x al cuadrado: el caso a cuadrado menos algo al cuadrado, con a igual a 1.`,
`Usamos el caso del seno, pero con lo que está al cuadrado: 2 x igual a seno de theta. Despejando, x es seno de theta partido en 2. Y derivando, d x es coseno de theta partido en 2, por d theta.`,
`Lo de adentro de la raíz: 1 menos seno al cuadrado, que es coseno al cuadrado. La raíz da coseno de theta.`,
`Reemplazamos todo: arriba, 2 por d x, que es 2 por coseno theta medios, d theta. Abajo, coseno de theta. Los 2 se cancelan, los cosenos se cancelan, y queda la integral de d theta. Eso es theta más C.`,
`Para volver a x, despejamos theta de 2 x igual a seno de theta: theta es arcoseno de 2 x. Respuesta: arcoseno de 2 x, más C. Este ejemplo también sale con la tabla y la sustitución u igual a 2 x, y te sirve para chequear.`]
});

{const T={x:820,y:560,w:300,h:230};
S({title:'Ejemplo: dx sobre x² raíz de x² + 9',
html:`
${Q(90,170,`${I()} ${fr('dx','x^2'+rt('x^2 + 9'))}`,0,'s')}
${Q(90,265,'x = 3 tan θ,     dx = 3 sec^2 θ dθ',1,'s')}
${Q(90,325,`${rt('9 tan^2 θ + 9')} = 3 sec θ`,1,'s')}
${Q(90,400,`${I()} ${fr('3 sec^2 θ','9 tan^2 θ · 3 sec θ')} dθ = ${fr('1','9')} ${I()} ${fr('cos θ','sen^2 θ')} dθ`,2,'s')}
${Q(90,505,`w = sen θ:   ${fr('1','9')} ${I()} ${fr('dw','w^2')} = −${fr('1','9 sen θ')} + C`,3,'s')}
${Q(90,600,`= −${fr(rt('x^2 + 9'),'9x')} + C`,5,'s box')}
${svg(`<g class="tri" data-b="4">
<polygon points="${T.x},${T.y} ${T.x+T.w},${T.y} ${T.x+T.w},${T.y-T.h}" class="ln" style="fill:rgba(180,140,255,.06)"/>
<polyline points="${T.x+T.w-18},${T.y} ${T.x+T.w-18},${T.y-18} ${T.x+T.w},${T.y-18}" class="ln2"/>

${tx(T.x+T.w/2,T.y+28,'3',null,'lab')}${tx(T.x+T.w+26,T.y-T.h/2,'x',null,'lab')}
${tx(T.x+T.w/2-58,T.y-T.h/2-28,'√(x² + 9)',null,'lab')}
${tc(T.x+T.w/2,T.y-T.h-40,'tan θ = x/3','acc',null,'middle',24)}
</g>`)}
${N(800,175,420,'sen θ = <i>x</i> / √(<i>x</i>² + 9)',4)}`,
beats:[
`Segundo ejemplo: la integral de d x partido por, x al cuadrado por raíz de x cuadrado más 9. Aparece raíz de x cuadrado más 9, que es x cuadrado más 3 al cuadrado: el caso de la tangente, con a igual a 3.`,
`Sustituimos x igual a 3 tangente de theta. Derivando, d x es 3 secante cuadrado de theta, d theta. Y la raíz: x cuadrado más 9 es 9 tangente cuadrado más 9, o sea 9 por, tangente cuadrado más 1, que es 9 secante cuadrado. La raíz da 3 secante de theta.`,
`Reemplazamos: arriba 3 secante cuadrado; abajo, x cuadrado es 9 tangente cuadrado, por 3 secante. Simplificamos: los 3 se cancelan, una secante se cancela, y queda un noveno de secante partido por tangente cuadrado. Escribiendo en senos y cosenos: secante es 1 partido por coseno, y tangente cuadrado es seno cuadrado partido por coseno cuadrado. Al dividir queda coseno partido por seno cuadrado.`,
`Esa integral se hace con una sustitución simple: w igual a seno de theta, d w igual a coseno de theta d theta. Queda un noveno de la integral de w a la menos 2, que es menos 1 partido por w. Resultado: menos 1 partido por, 9 seno de theta, más C.`,
`Ahora hay que volver a x, y para eso el triángulo. Como x es 3 tangente de theta, tangente de theta es x partido por 3: cateto opuesto x, cateto adyacente 3. Por Pitágoras, la hipotenusa es raíz de x cuadrado más 9. Entonces seno de theta, que es opuesto partido por hipotenusa, es x partido por raíz de x cuadrado más 9.`,
`Reemplazando: 1 partido por seno de theta es raíz de x cuadrado más 9, partido por x. Respuesta: menos raíz de x cuadrado más 9, partido por 9 x, más C.`]
});}

S({title:'Ejemplo: raíz de x² − 4 partido por x',
html:`
${Q(90,170,`${I()} ${fr(rt('x^2 − 4'),'x')} dx:     x = 2 sec θ,   dx = 2 sec θ tan θ dθ`,0,'s')}
${Q(90,275,`${rt('4 sec^2 θ − 4')} = 2 tan θ`,1,'s')}
${Q(90,345,`${I()} ${fr('2 tan θ','2 sec θ')} · 2 sec θ tan θ dθ = ${I()} 2 tan^2 θ dθ`,2,'s')}
${Q(90,440,`= 2 ${I()} (sec^2 θ − 1) dθ = 2 tan θ − 2θ + C`,3,'s')}
${Q(90,525,`tan θ = ${fr(rt('x^2 − 4'),'2')},     θ = arcsec(${fr('x','2')})`,4,'s')}

beats:[
`Tercer ejemplo: la integral de raíz de x cuadrado menos 4, partido por x. Es el caso x cuadrado menos a cuadrado con a igual a 2. Sustituimos x igual a 2 secante de theta. La derivada de secante es secante por tangente, así que d x es 2 secante theta tangente theta, d theta.`,
`La raíz: 4 secante cuadrado menos 4 es 4 por, secante cuadrado menos 1, que es 4 tangente cuadrado. La raíz es 2 tangente de theta. Tomamos theta entre cero y pi medios, donde la tangente es positiva.`,
`Reemplazamos: 2 tangente partido por 2 secante, por 2 secante tangente d theta. Las secantes se cancelan, los 2 de la fracción también, y queda 2 tangente cuadrado de theta.`,
`Tangente cuadrado no está en la tabla, pero es secante cuadrado menos 1. La integral de secante cuadrado es tangente, y la de 1 es theta. Queda 2 tangente de theta, menos 2 theta, más C.`,
`Volvemos a x. De x igual a 2 secante, el triángulo tiene hipotenusa x y cateto adyacente 2, así que el opuesto es raíz de x cuadrado menos 4, y tangente de theta es raíz de x cuadrado menos 4 partido en 2. Y theta es arcosecante de x medios. Respuesta: raíz de x cuadrado menos 4, menos 2 arcosecante de x medios, más C. También se puede escribir con arcocoseno de 2 partido por x.`]
});

/* ===================== PARTES ===================== */
CH('Integración por partes','Clase 10','Capítulo cuatro: integración por partes. Es la regla del producto, leída al revés.');

S({title:'De dónde sale la fórmula',
html:`
${Q(90,175,'(f · g)′ = f · g′ + g · f′',0,'s')}
${N(620,183,580,'Regla del producto.',0)}
${Q(90,255,`f · g = ${I()} f g′ dx + ${I()} g f′ dx`,1,'s')}
${Q(90,345,`${I()} f g′ dx = f g − ${I()} g f′ dx`,2,'s')}
${Q(90,440,'u = f(x),  du = f′(x) dx       v = g(x),  dv = g′(x) dx',3,'xs')}
${Q(640,540,`${I()} u dv = u v − ${I()} v du`,4,'l c box')}
${N(90,630,1100,'Cambia una integral difícil por otra <b>más fácil</b>: ∫ <i>v</i> d<i>u</i>.',4)}`,
beats:[
`La integración por partes sale de la regla del producto. La derivada de f por g es f por g prima, más g por f prima.`,
`Si integramos ambos lados, a la izquierda la integral de la derivada de f por g es simplemente f por g. Y a la derecha queda la suma de dos integrales: la de f por g prima, y la de g por f prima.`,
`Despejamos la primera: la integral de f por g prima es igual a f por g, menos la integral de g por f prima. Esa es la fórmula de integración por partes.`,
`Para recordarla más fácil se usan letras nuevas. u es f de x, y entonces d u es f prima d x. v es g de x, y d v es g prima d x.`,
`Y la fórmula queda así: la integral de u d v es u v menos la integral de v d u. La idea es que tienes una integral difícil, la partes en dos pedazos, u y d v, y la cambias por otra integral, la de v d u, que debería ser más fácil.`]
});

S({title:'Cómo elegir u y dv',
html:`
${N(90,170,1100,'Una regla práctica: <b>u</b> es la que aparece <b>primero</b> en esta lista. Todo lo demás es <b>dv</b>.',0)}
${LI(90,240,'L','<b>Logarítmicas:</b> ln <i>x</i>',1)}
${LI(90,305,'I','<b>Inversas trigonométricas:</b> arctan <i>x</i>, arcsen <i>x</i>',1)}
${LI(90,370,'A','<b>Algebraicas:</b> <i>x</i>, <i>x</i>², polinomios',1)}
${LI(90,435,'T','<b>Trigonométricas:</b> sen <i>x</i>, cos <i>x</i>',1)}
${LI(90,500,'E','<b>Exponenciales:</b> <i>e<sup>x</sup></i>',1)}
${N(90,580,1100,'¿Por qué? <b>u</b> conviene que se simplifique al derivar, y <b>dv</b> tiene que poder integrarse.',2)}`,
beats:[
`Lo difícil de partes es decidir quién es u y quién es d v. Una regla práctica muy usada se llama LIATE: u es la función que aparece primero en esta lista, y todo lo demás, incluido el d x, es d v.`,
`L de logarítmicas, I de inversas trigonométricas, A de algebraicas, o sea polinomios, T de trigonométricas, y E de exponenciales. Por ejemplo, en x por coseno de x, x es algebraica y coseno es trigonométrica: la A va antes que la T, así que u es x.`,
`La razón detrás de la regla: a u la vamos a derivar, y conviene que se simplifique al derivar, como x, que pasa a ser 1, o logaritmo, que pasa a ser 1 partido por x. A d v la vamos a integrar, así que tiene que ser algo que sepamos integrar, como coseno o e a la x.`]
});

S({title:'Ejemplo: x cos x',
html:`
${Q(90,175,`${I()} x cos x dx`,0,'')}
${UV(500,170,'u = x','dv = cos x dx','du = dx','v = sen x',1)}
${Q(90,320,`${I()} x cos x dx = x sen x − ${I()} sen x dx`,2,'s')}
${Q(90,420,'= x sen x + cos x + C',3,'s box')}
${N(90,520,1100,'Comprueba: (<i>x</i> sen <i>x</i> + cos <i>x</i>)′ = sen <i>x</i> + <i>x</i> cos <i>x</i> − sen <i>x</i> = <i>x</i> cos <i>x</i>. ✓',4)}`,
beats:[
`Primer ejemplo de la clase: la integral de x coseno de x. Por LIATE, la x es algebraica y va antes que el coseno: u es x, y d v es coseno de x d x.`,
`Armamos una tablita para no perdernos. Arriba lo que elegimos: u igual a x, d v igual a coseno de x d x. Abajo, derivamos u: d u es d x. E integramos d v: v es seno de x. Para v no hace falta poner la constante.`,
`Aplicamos la fórmula: u por v, que es x seno de x, menos la integral de v d u, que es la integral de seno de x d x. Fíjate que la integral nueva es mucho más fácil que la original.`,
`La integral de seno es menos coseno, y con el menos de adelante queda más coseno. Respuesta: x seno de x, más coseno de x, más C.`,
`Comprobamos derivando. La derivada de x seno de x, por la regla del producto, es seno de x más x coseno de x. La derivada de coseno es menos seno. Sumando, los senos se cancelan y queda x coseno de x. Correcto.`]
});

S({title:'Ejemplo: x² eˣ, partes dos veces',
html:`
${UV(90,170,'u = x^2','dv = e^{x} dx','du = 2x dx','v = e^{x}',0,440)}
${Q(600,190,`${I()} x^2 e^{x} dx = x^2 e^{x} − ${I()} 2x e^{x} dx`,1,'s')}
${UV(90,330,'u = 2x','dv = e^{x} dx','du = 2 dx','v = e^{x}',2,440)}
${Q(600,350,`${I()} 2x e^{x} dx = 2x e^{x} − 2e^{x}`,2,'s')}
${Q(90,500,'= x^2 e^{x} − (2x e^{x} − 2e^{x}) + C',3,'s')}
${Q(90,580,'= e^{x}(x^2 − 2x + 2) + C',4,'s box')}
${N(700,590,500,'El paréntesis cambia los <b>dos</b> signos.',4)}`,
beats:[
`Segundo ejemplo: la integral de x al cuadrado por e a la x. Por LIATE, la algebraica va antes que la exponencial: u igual a x al cuadrado, d v igual a e a la x d x. Entonces d u es 2 x d x, y v es e a la x.`,
`La fórmula da: x al cuadrado e a la x, menos la integral de 2 x e a la x. La integral nueva todavía tiene una x multiplicando, pero bajó de x cuadrado a x. Vamos bien.`,
`Aplicamos partes otra vez a la integral nueva: u igual a 2 x, d v igual a e a la x d x. Entonces d u es 2 d x, y v es e a la x. Queda 2 x e a la x, menos la integral de 2 e a la x, que es 2 e a la x. O sea: 2 x e a la x menos 2 e a la x.`,
`Volvemos a la primera ecuación y reemplazamos esa integral, con paréntesis. Ojo con el signo: es menos todo el paréntesis.`,
`Al abrir el paréntesis, el menos cambia los dos signos: queda x cuadrado e a la x, menos 2 x e a la x, más 2 e a la x. Factorizando e a la x: e a la x por, x cuadrado menos 2 x más 2, más C. Regla general: con x a la n por una exponencial o un seno, aplicas partes n veces.`]
});

S({title:'El truco dv = dx: ln x y arctan x',
html:`
${UV(90,170,'u = ln x','dv = dx',`du = ${fr('dx','x')}`,'v = x',0,440)}
${Q(600,190,`${I()} ln x dx = x ln x − ${I()} x · ${fr('1','x')} dx`,1,'s')}
${Q(600,275,'= x ln x − x + C',1,'s box')}
${svg(ln(90,360,1190,360,2,'ln2'))}
${UV(90,385,'u = arctan x','dv = dx',`du = ${fr('dx','1 + x^2')}`,'v = x',2,440)}
${Q(600,400,`${I()} arctan x dx = x arctan x − ${I()} ${fr('x','1 + x^2')} dx`,3,'s')}
${Q(90,560,`w = 1 + x^2,  dw = 2x dx:   ${I()} ${fr('x','1 + x^2')} dx = ${fr('1','2')} ln(1 + x^2)`,4,'s')}
${Q(90,640,`${I()} arctan x dx = x arctan x − ${fr('1','2')} ln(1 + x^2) + C`,5,'xs box')}`,
beats:[
`Ahora un truco muy útil: ¿cómo integrar logaritmo de x, si está solo? No hay nada que multiplique... salvo el d x. Tomamos u igual a logaritmo de x, y d v igual a d x. Entonces d u es d x partido por x, y v es x.`,
`La fórmula: x logaritmo de x, menos la integral de x por 1 partido por x. Las x se cancelan y queda la integral de 1, que es x. Respuesta: x logaritmo de x, menos x, más C. Esta conviene saberla de memoria.`,
`Con el mismo truco se integran las inversas trigonométricas. Para arcotangente de x: u igual a arcotangente, d v igual a d x. Entonces d u es d x partido por, 1 más x cuadrado, y v es x.`,
`La fórmula da: x arcotangente de x, menos la integral de x partido por, 1 más x cuadrado.`,
`Esa integral sale por sustitución: w igual a 1 más x cuadrado, d w igual a 2 x d x, así que x d x es d w partido en 2. Queda un medio de la integral de d w partido por w, que es un medio logaritmo de w. O sea, un medio de logaritmo de 1 más x cuadrado. No necesita valor absoluto porque 1 más x cuadrado siempre es positivo.`,
`Respuesta final: x arcotangente de x, menos un medio logaritmo de, 1 más x cuadrado, más C. El arcoseno se hace igual, y da x arcoseno de x, más raíz de 1 menos x cuadrado. Inténtalo.`]
});

S({title:'Sustitución primero, partes después',
html:`
${Q(90,175,`${I()} cos(${rt('x')}) dx`,0,'s')}
${Q(400,175,`w = ${rt('x')}  ⇒  x = w^2,  dx = 2w dw`,0,'s')}
${Q(90,260,`${I()} cos(w) · 2w dw = 2 ${I()} w cos w dw`,1,'s')}
${Q(90,345,`= 2(w sen w + cos w) + C = 2${rt('x')} sen${rt('x')} + 2 cos${rt('x')} + C`,2,'s box')}
${svg(ln(90,430,1190,430,3,'ln2'))}
${Q(90,455,`${I()} 2x^3 cos(x^2) dx = ${I()} x^2 · cos(x^2) · 2x dx`,3,'s')}
${Q(90,540,`w = x^2,  dw = 2x dx:    ${I()} w cos w dw = w sen w + cos w`,4,'s')}
${Q(90,620,'= x^2 sen(x^2) + cos(x^2) + C',4,'s box')}`,
beats:[
`A veces hay que combinar métodos. Ejemplo de la clase: la integral de coseno de raíz de x. La raíz adentro del coseno molesta, así que primero una sustitución: w igual a raíz de x. Entonces x es w al cuadrado, y d x es 2 w d w.`,
`Reemplazando, queda la integral de coseno de w por 2 w d w, o sea 2 veces la integral de w coseno de w. ¡Esa la acabamos de hacer por partes!`,
`Usando el resultado anterior con w en vez de x: 2 por, w seno de w más coseno de w. Volviendo a x: 2 raíz de x seno de raíz de x, más 2 coseno de raíz de x, más C.`,
`Otro de la clase: la integral de 2 x al cubo coseno de x cuadrado. El truco es separar x al cubo como x cuadrado por x. Así aparece 2 x d x, que es justo la derivada de x cuadrado.`,
`Con w igual a x cuadrado y d w igual a 2 x d x, la integral queda: la integral de w coseno de w d w. De nuevo, por partes, da w seno de w más coseno de w. Y volviendo: x cuadrado seno de x cuadrado, más coseno de x cuadrado, más C.`]
});

/* ===================== FRACCIONES PARCIALES ===================== */
CH('Fracciones parciales','Clase 10','Capítulo cinco: fracciones parciales. Es el método para integrar cualquier cociente de polinomios.');

S({title:'Funciones racionales: propias e impropias',
html:`
${Q(90,180,`${fr('p(x)','q(x)')}`,0,'')}
${N(240,190,960,'Cociente de polinomios: una <b>función racional</b>.',0)}
${N(90,290,1100,'<b>Propia:</b> grado de arriba <b>menor</b> que grado de abajo. Si no, es <b>impropia</b>.',1)}
${Q(90,380,`{{Impropia: se divide primero}}     ${fr('p(x)','q(x)')} = c(x) + ${fr('r(x)','q(x)')}`,2,'s')}
${N(90,480,1100,'<i>c</i>: cociente (un polinomio, fácil de integrar). &nbsp;<i>r</i>: resto, con grado menor que <i>q</i>.',2)}
${N(90,560,1100,'Después, la fracción propia se escribe como <b>suma de fracciones simples</b>, que integran a logaritmos, potencias y arcotangentes.',3)}`,
beats:[
`Las fracciones parciales sirven para integrar funciones racionales: un polinomio partido por otro polinomio. Al integrarlas pueden aparecer logaritmos y arcotangentes, aunque partimos de polinomios.`,
`Primera pregunta siempre: ¿la fracción es propia o impropia? Es propia si el grado del numerador es menor que el grado del denominador. Si el grado de arriba es mayor o igual, es impropia.`,
`Si es impropia, hay que dividir los polinomios antes de todo. Así queda un cociente c de x, que es un polinomio, más el resto partido por el denominador. Y ese resto siempre tiene grado menor que q, así que esa fracción ya es propia.`,
`Después, la fracción propia se descompone como suma de fracciones más simples, las fracciones parciales. Cada una de ellas se integra con la tabla: da logaritmos, potencias, o arcotangentes.`]
});

S({title:'Los cuatro casos',
html:`
${N(90,165,1100,'Factoriza <i>q</i>(<i>x</i>) y escribe <b>un término por cada factor</b>:',0)}
${CARD(90,215,540,170,'1 · Lineal no repetido',`(x − a)  →  ${fr('A','x − a')}`,1)}
${CARD(660,215,540,170,'2 · Lineal repetido k veces',`(x − a)^{k}  →  ${fr('A_1','x − a')} + … + ${fr('A_k','(x − a)^{k}')}`,2)}
${CARD(90,410,540,170,'3 · Cuadrático irreducible',`x^2 + bx + c  →  ${fr('Ax + B','x^2 + bx + c')}`,3)}
${CARD(660,410,540,170,'4 · Cuadrático repetido',`(x^2 + bx + c)^{k}  →  ${fr('A_{1}x + B_{1}','x^2 + bx + c')} + …`,4)}
${N(90,605,1100,'Irreducible: no tiene raíces reales, o sea <b><i>b</i>² − 4<i>c</i> < 0</b>. Arriba va <b><i>Ax</i> + <i>B</i></b>, no solo una constante.',3)}`,
beats:[
`Para descomponer, primero se factoriza el denominador lo más posible. Después se escribe un término por cada factor, según cuatro casos.`,
`Caso uno: un factor lineal, x menos a, que aparece una sola vez. Le corresponde un término A partido por x menos a, con A una constante por encontrar.`,
`Caso dos: un factor lineal repetido k veces, x menos a elevado a k. Le corresponden k términos: A uno partido por x menos a, A dos partido por x menos a al cuadrado, y así hasta A k partido por x menos a elevado a k. Uno por cada potencia, no solo la más alta.`,
`Caso tres: un factor cuadrático irreducible, o sea, que no se puede factorizar en reales porque su discriminante b cuadrado menos 4 c es negativo. Le corresponde A x más B, partido por ese cuadrático. Ojo: arriba va un polinomio de grado uno, no solo una constante.`,
`Caso cuatro: un cuadrático irreducible repetido k veces. Igual que el caso dos, pero cada numerador es de la forma A x más B. Ahora veamos ejemplos de la clase.`]
});

S({title:'Ejemplo: factores lineales distintos',
html:`
${Q(90,170,`${fr('5x + 6','x^3 + 3x^2 + 2x')} = ${fr('5x + 6','x(x + 1)(x + 2)')} = ${fr('A','x')} + ${fr('B','x + 1')} + ${fr('C','x + 2')}`,0,'s')}
${Q(90,280,'5x + 6 = A(x + 1)(x + 2) + Bx(x + 2) + Cx(x + 1)',1,'s')}
${Q(90,355,'x = 0:      6 = 2A   ⇒  A = 3',2,'s')}
${Q(90,415,'x = −1:    1 = −B   ⇒  B = −1',2,'s')}
${Q(90,475,'x = −2:    −4 = 2C  ⇒  C = −2',2,'s')}
${Q(90,570,`${I()} f dx = 3 ln|x| − ln|x + 1| − 2 ln|x + 2| + C`,4,'s box')}
${N(760,365,440,'En cada raíz, <b>dos de los tres términos se anulan</b>.',3)}`,
beats:[
`Primer ejemplo de la clase: 5 x más 6, partido por, x al cubo más 3 x cuadrado más 2 x. Arriba grado 1, abajo grado 3: es propia. Factorizamos el denominador: x es factor común, queda x por, x cuadrado más 3 x más 2, y ese cuadrático se factoriza como, x más 1, por, x más 2. Tres factores lineales distintos: A partido por x, más B partido por x más 1, más C partido por x más 2.`,
`Para encontrar A, B y C, multiplicamos toda la igualdad por el denominador. Cada fracción pierde el factor que tenía abajo. Queda: 5 x más 6 igual a A por, x más 1, por x más 2, más B por x por x más 2, más C por x por x más 1.`,
`Ahora el truco más rápido: evaluar en las raíces del denominador. Con x igual a cero: a la izquierda queda 6, y a la derecha solo sobrevive A por 1 por 2. Entonces A es 3. Con x igual a menos 1: a la izquierda, menos 5 más 6, que es 1; a la derecha solo B por menos 1 por 1. Entonces B es menos 1. Con x igual a menos 2: a la izquierda menos 10 más 6, menos 4; a la derecha solo C por menos 2 por menos 1, que es 2 C. Entonces C es menos 2.`,
`¿Por qué funciona? Porque en cada raíz, dos de los tres términos tienen un factor que vale cero, y desaparecen. Así cada constante sale sola.`,
`Integramos cada fracción: la integral de A partido por x menos a es A logaritmo del valor absoluto de x menos a. Resultado: 3 logaritmo de x, menos logaritmo de x más 1, menos 2 logaritmo de x más 2, todos con valor absoluto, más C.`]
});

S({title:'Ejemplo: un factor cuadrático',
html:`
${Q(90,170,`${fr('x^2 − 3x + 6','(x + 1)(x^2 + 4)')} = ${fr('A','x + 1')} + ${fr('Bx + C','x^2 + 4')}`,0,'s')}
${Q(90,270,'x^2 − 3x + 6 = A(x^2 + 4) + (Bx + C)(x + 1)',1,'s')}
${Q(90,340,'x = −1:   10 = 5A  ⇒  A = 2',1,'s')}
${Q(90,410,'x^2:  1 = A + B  ⇒  B = −1          {{constante:}}  6 = 4A + C  ⇒  C = −2',2,'xs')}
${Q(90,480,`${I()} (${fr('2','x + 1')} − ${fr('x','x^2 + 4')} − ${fr('2','x^2 + 4')}) dx`,3,'s')}
${Q(90,580,`= 2 ln|x + 1| − ${fr('1','2')} ln(x^2 + 4) − arctan(${fr('x','2')}) + C`,5,'s box')}
${N(760,470,440,'<i>x</i>/(<i>x</i>²+4): sustitución <i>w</i> = <i>x</i>² + 4.',4)}
${N(760,530,440,'∫ d<i>x</i>/(<i>x</i>² + <i>a</i>²) = (1/<i>a</i>) arctan(<i>x</i>/<i>a</i>)',4)}`,
beats:[
`Segundo ejemplo: x cuadrado menos 3 x más 6, partido por, x más 1, por x cuadrado más 4. x cuadrado más 4 no tiene raíces reales, así que es irreducible. Descomposición: A partido por x más 1, más, B x más C, partido por x cuadrado más 4.`,
`Multiplicamos por el denominador: x cuadrado menos 3 x más 6 igual a A por x cuadrado más 4, más, B x más C, por x más 1. Evaluamos en la única raíz real, x igual a menos 1: a la izquierda, 1 más 3 más 6, que es 10. A la derecha solo A por 5. Entonces A es 2.`,
`Para B y C comparamos coeficientes. Los términos con x cuadrado: a la izquierda hay 1; a la derecha, A más B. Entonces 1 es 2 más B, y B es menos 1. Los términos constantes: a la izquierda 6; a la derecha, 4 A más C, o sea 8 más C. Entonces C es menos 2. Puedes chequear con los términos en x: menos 3 debería ser B más C, y efectivamente menos 1 menos 2 es menos 3.`,
`Escribimos la integral separando la segunda fracción en dos: 2 partido por x más 1, menos x partido por x cuadrado más 4, menos 2 partido por x cuadrado más 4.`,
`La primera da logaritmo. La segunda sale con w igual a x cuadrado más 4: da un medio logaritmo. Y la tercera usa la fórmula de arcotangente con a igual a 2: la integral de 1 partido por, x cuadrado más a cuadrado, es 1 partido por a, arcotangente de x partido por a.`,
`Resultado: 2 logaritmo de x más 1, menos un medio logaritmo de, x cuadrado más 4, menos arcotangente de x medios, más C. Fíjate que el 2 de arriba por el un medio de la fórmula da 1.`]
});

S({title:'Ejemplo: un factor lineal repetido',
html:`
${Q(90,170,`${fr('3x^3 − 8x^2 + 4x − 1','x^2 (x − 1)^2')} = ${fr('A','x')} + ${fr('B','x^2')} + ${fr('C','x − 1')} + ${fr('D','(x − 1)^2')}`,0,'s')}
${Q(90,270,'3x^3 − 8x^2 + 4x − 1 = Ax(x − 1)^2 + B(x − 1)^2 + Cx^2(x − 1) + Dx^2',1,'xs')}
${Q(90,340,'x = 0:  B = −1          x = 1:  D = −2',2,'s')}
${Q(90,410,'x:  4 = A − 2B  ⇒  A = 2          x^3:  3 = A + C  ⇒  C = 1',3,'s')}
${Q(90,500,`${I()} f dx = 2 ln|x| + ${fr('1','x')} + ln|x − 1| + ${fr('2','x − 1')} + C`,4,'s box')}
${N(90,600,1100,'Recuerda: ∫ <i>dx</i>/(<i>x</i> − <i>a</i>)² = −1/(<i>x</i> − <i>a</i>). Por eso los signos de <i>B</i> y <i>D</i> cambian.',4)}`,
beats:[
`Tercer ejemplo: 3 x al cubo menos 8 x cuadrado más 4 x menos 1, partido por, x cuadrado por x menos 1 al cuadrado. Grado 3 arriba, grado 4 abajo: propia. Hay dos factores lineales repetidos dos veces cada uno: x al cuadrado, y x menos 1 al cuadrado. Entonces van cuatro términos: A partido por x, B partido por x cuadrado, C partido por x menos 1, y D partido por x menos 1 al cuadrado.`,
`Multiplicamos por el denominador. Cada término pierde lo que tiene abajo, y conserva el resto del denominador.`,
`Evaluamos en las raíces. Con x igual a cero, solo sobrevive B por menos 1 al cuadrado, o sea B, y a la izquierda queda menos 1. Entonces B es menos 1. Con x igual a 1, solo sobrevive D por 1, y a la izquierda, 3 menos 8 más 4 menos 1, que es menos 2. Entonces D es menos 2.`,
`Faltan A y C, y ya no hay más raíces. Comparamos coeficientes. Términos en x: a la izquierda, 4. A la derecha, A x por el 1 de, x menos 1 al cuadrado, da A; y B por el menos 2 x del desarrollo, da menos 2 B. Entonces 4 es A más 2, y A es 2. Términos en x al cubo: a la izquierda 3; a la derecha A más C. Entonces C es 1.`,
`Integramos. A partido por x da 2 logaritmo de x. B partido por x cuadrado es menos x a la menos 2, y su integral es más 1 partido por x. C da logaritmo de x menos 1. Y D, menos 2 partido por x menos 1 al cuadrado, da más 2 partido por x menos 1.`]
});

/* ===================== RIEMANN ===================== */
CH('La integral definida','Clase 11','Capítulo seis: la integral definida. Volvemos al problema de calcular un área, y aparece una suma infinita.');

{const g=G(130,610,230,95),f=x=>1+0.8*Math.sin(1.6*x)+0.35*x,a=0.25,b=4.2,G2=G(130,610,230/1,95);
const g2=G(130,600,145,92);
S({title:'El problema del área',
html:`${svg(`
${axes(g2,-0.2,4.6,-0.2,4.3,0,{xt:[[a,'a'],[b,'b']],yt:[]})}
${sh(regD(g2,f,x=>0,a,b),'shade',0)}
<path id="r_rc" class="rect"/>
${cv(g2,f,0,4.5,'f1',0)}
${tc(g2.X(4.4),g2.Y(f(4.4))-26,'y = f(x)','f1',0,'end',24)}
`)}
${N(820,175,400,'¿Cuál es el área bajo la curva, entre <i>a</i> y <i>b</i>?',0)}
${N(820,280,400,'Aproximamos con <b>rectángulos</b>: base Δ<i>x</i>, altura <i>f</i>(<i>x<sub>k</sub></i>*).',1)}
<div class="eq s" style="left:820px;top:400px" data-b="1"><i>n</i> = <span id="r_n">7</span></div>
${Q(820,470,'A ≈ Σ f(x_k^{*}) Δx',2,'s')}
${N(820,550,400,'Más rectángulos ⇒ <b>mejor aproximación</b>.',3)}`,
beats:[
`Cambiamos de tema. La pregunta es: ¿cuánto mide el área bajo la curva y igual a f de x, sobre el eje x, entre x igual a a y x igual a b? Para un rectángulo o un triángulo sabemos, pero esta región tiene un borde curvo.`,
`La idea es aproximar con rectángulos. Dividimos el intervalo de a a b en partes iguales, como en la clase, que usó siete. Sobre cada parte levantamos un rectángulo, con altura igual al valor de f en algún punto de esa parte.`,
`El área de cada rectángulo es base por altura: f de x k estrella por delta x. Y el área total se aproxima sumando todos los rectángulos. Esa suma se anota con la letra sigma, la suma desde k igual a 1 hasta n.`,
`Mira qué pasa si duplicamos el número de rectángulos: la aproximación mejora, porque los pedacitos que sobran y los que faltan se hacen cada vez más chicos. Y si hacemos esto con infinitos rectángulos infinitamente delgados, obtenemos el área exacta. Esa es la idea de la integral.`],
on(j,r){if(j<3){r._n=7;setD(r,'r_rc',rectsD(g2,f,a,b,7,'M'));setTx(r,'r_n','7')}},
loop(st,r,j,t){if(j<3)return;const n=[14,28,56,112][Math.min(3,Math.floor(t/2.5))];if(r._n!==n){r._n=n;setD(r,'r_rc',rectsD(g2,f,a,b,n,'M'));setTx(r,'r_n',String(n))}}
});}

${tc(nl.X(0),290,'a','f5',null,'middle',26)}${tc(nl.X(4.3),290,'b','f5',null,'middle',26)}
</g>
<g data-b="2">${[0.5,1.6,2.4,3.9].map((v,i)=>`<circle cx="${nl.X(v)}" cy="330" r="7" style="fill:var(--f3)"/>`).join('')}${[0.5,1.6,2.4,3.9].map((v,i)=>tc(nl.X(v),300,'x'+'₁₂₃₄'[i]+'*','f3',null,'middle',22)).join('')}</g>
`)}
${Q(90,170,'P = {x_0, x_1, …, x_n},     a = x_0 < x_1 < … < x_n = b',0,'s')}
${N(90,410,560,'<b>Δ<i>x</i><sub><i>k</i></sub></b> = <i>x<sub>k</sub></i> − <i>x</i><sub><i>k</i>−1</sub>. &nbsp;Norma ‖<i>P</i>‖: el subintervalo más largo.',1)}
${Q(90,505,'S = Σ_{k=1}^{n} f(x_k^{*}) Δx_k',3,'s box')}
${N(90,585,560,'<b>Regular:</b> Δ<i>x</i> = (<i>b</i> − <i>a</i>)/<i>n</i> &nbsp;y&nbsp; <i>x<sub>k</sub></i> = <i>a</i> + <i>k</i> Δ<i>x</i>.',4)}
${N(720,410,480,'Puntos <b>muestrales</b> <i>x<sub>k</sub></i>*: cualquiera dentro de su subintervalo [<i>x</i><sub><i>k</i>−1</sub>, <i>x<sub>k</sub></i>].',2)}`,
beats:[
`Ahora las definiciones formales. Una partición del intervalo a, b es un conjunto de puntos ordenados, x cero, x uno, hasta x n, que empieza en a y termina en b. Esos puntos cortan el intervalo en n subintervalos.`,
`El largo de cada subintervalo se anota delta x k: es x k menos x k menos 1. Los subintervalos pueden tener largos distintos. El más largo de todos se llama la norma de la partición.`,
`En cada subintervalo elegimos un punto, que se llama punto muestral, x k estrella. Puede ser el extremo izquierdo, el derecho, el punto medio, o cualquier otro, siempre que esté dentro de ese subintervalo. En el dibujo son los puntos rosados.`,
`Con eso se arma la suma de Riemann: la suma, desde k igual a 1 hasta n, de f de x k estrella por delta x k. Es exactamente la suma de las áreas de los rectángulos.`,
`Un caso muy usado: la partición regular, donde todos los subintervalos miden lo mismo. Entonces delta x es, b menos a, partido por n, y los puntos son x k igual a a más k delta x.`]
});}

{const g=G(150,610,185,40),f=x=>x*x,P=[0,.5,1,2,2.5,3];
S({title:'Ejercicio: una suma de Riemann de x²',
