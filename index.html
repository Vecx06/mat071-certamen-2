${axes(g,-0.2,3.4,-0.3,10.2,0,{xt:[[.5,'½'],[1,'1'],[2,'2'],[2.5,'5/2'],[3,'3']],yt:[[4,'4'],[9,'9']]})}
<path id="rs_r" class="rect" data-b="1"/>
${cv(g,f,0,3.2,'f1',0,{lim:10})}
`)}
${N(850,170,370,'<i>f</i>(<i>x</i>) = <i>x</i>² en [0, 3], con <i>P</i> = {0, ½, 1, 2, 5/2, 3}.',0)}
${Q(850,265,'Δx_k:  ½, ½, 1, ½, ½',1,'xs')}
${N(850,315,370,'Puntos <b>derechos</b>:',2)}
${Q(850,355,'f:  ¼, 1, 4, 25/4, 9',2,'xs')}
${Q(850,410,'S_{der} = 49/4 = 12,25',2,'xs box')}
${N(850,480,370,'Puntos <b>izquierdos</b>:',3)}
${Q(850,520,'S_{izq} = 25/4 = 6,25',3,'xs box')}
${N(850,590,370,'Valor exacto: <b>9</b> (quedó entre medio).',4)}`,
beats:[
`Ejercicio de la clase: construir una suma de Riemann para f de x igual a x cuadrado en el intervalo cero, tres, con la partición cero, un medio, uno, dos, cinco medios, tres. Ojo que no es regular.`,
`Primero los largos de los subintervalos: de cero a un medio, un medio. De un medio a uno, un medio. De uno a dos, uno. De dos a cinco medios, un medio. Y de cinco medios a tres, un medio.`,
`Elegimos como puntos muestrales los extremos derechos: un medio, uno, dos, cinco medios y tres. Sus imágenes son un cuarto, uno, cuatro, veinticinco cuartos y nueve. Multiplicando cada una por su base y sumando: un octavo, más un medio, más cuatro, más veinticinco octavos, más nueve medios. Eso da cuarenta y nueve cuartos, o sea 12 coma 25.`,
`Si en cambio usamos los extremos izquierdos, las alturas son cero, un cuarto, uno, cuatro y veinticinco cuartos, y la suma da veinticinco cuartos, o sea 6 coma 25. Como x cuadrado es creciente aquí, los rectángulos derechos se pasan del área y los izquierdos se quedan cortos.`,
`El área exacta, que vamos a saber calcular con el teorema fundamental, es 9. Y efectivamente está entre las dos sumas. Si la partición fuera más fina, las dos sumas se acercarían a 9.`],
on(j,r){const S=j>=3?P.slice(0,-1):P.slice(1);setD(r,'rs_r',rectsP(g,f,P,S))}
});}

{const g=G(760,430,100,80),f=x=>Math.sin(1.25*x)*1.6+0.2;
S({title:'La integral definida',
html:`
${Q(90,170,`${I('a','b')} f(x) dx = lím_{‖P‖→0} Σ_{k=1}^{n} f(x_k^{*}) Δx_k`,0,'s box')}
${N(90,265,560,'Si el límite existe (y no depende de los <i>x<sub>k</sub></i>*), <i>f</i> es <b>integrable</b>.',0)}
${N(90,350,560,'Es un <b>número</b>. La letra no importa: ∫<i>f</i>(<i>x</i>) d<i>x</i> = ∫<i>f</i>(<i>t</i>) d<i>t</i>.',1)}
${N(90,440,560,'Lo que está bajo el eje <b>resta</b>: es un área <b>con signo</b>.',2)}
${Q(90,540,`{{Área total}} = ${I('a','b')} |f(x)| dx`,3,'s')}
${svg(`<g>
${axes(g,-0.2,4.4,-1.8,2.3,2,{xl:'x',yl:false})}
${sh(regD(g,x=>Math.max(0,f(x)),x=>0,0,4.2),'shade2',2)}${sh(regD(g,x=>Math.min(0,f(x)),x=>0,0,4.2),'shade3',2)}
${cv(g,f,0,4.2,'f1',2)}
${tc(g.X(1.2),g.Y(.7),'+','f4',2,'middle',40)}${tc(g.X(3.55),g.Y(-.6),'−','f6',2,'middle',40)}
</g>`)}
${N(90,620,1100,'Ojo: si te piden un <b>área</b>, separa donde <i>f</i> cambia de signo y suma todo en positivo.',4)}`,
beats:[
`Ahora la definición. La integral definida de f, de a hasta b, es el límite de las sumas de Riemann cuando la norma de la partición tiende a cero, o sea, cuando todos los subintervalos se hacen infinitamente chicos. Si ese límite existe, y da lo mismo sin importar qué puntos muestrales elijas, se dice que f es integrable en a, b.`,
`Una diferencia clave con la integral indefinida: la integral definida es un número, no una familia de funciones. Por eso la letra de la variable no importa: integral de f de x d x, o de f de t d t, da exactamente el mismo número. Se le dice variable muda.`,
`Si f es positiva, la integral es el área bajo la curva. Pero si f toma valores negativos, los rectángulos que quedan bajo el eje tienen altura negativa, y su área se resta. Entonces la integral es un área con signo: lo de arriba suma, lo de abajo resta.`,
`Por eso, si quieres el área total de la región sombreada, verde más roja, hay que integrar el valor absoluto de f.`,
`En la práctica: si te piden un área, mira dónde f cambia de signo, separa la integral en esos puntos, y suma cada pedazo en positivo. Este es uno de los errores más comunes en los certámenes.`]
});}

S({title:'Cuándo existe, y las propiedades',
html:`
${N(90,170,1100,'<b>Criterio:</b> si <i>f</i> es <b>continua</b> en [<i>a</i>, <i>b</i>], o tiene solo un número finito de <b>saltos</b>, entonces es integrable.',0)}
${TB(90,260,[520],[{c:[`${I('a','a')} f dx = 0`],b:1},{c:[`${I('a','b')} f dx = −${I('b','a')} f dx`],b:1},{c:[`${I('a','b')} c dx = c(b − a)`],b:1}])}
${TB(660,260,[540],[{c:[`${I('a','b')} (f + g) = ${I('a','b')} f + ${I('a','b')} g`],b:2},{c:[`${I('a','b')} c f = c ${I('a','b')} f`],b:2},{c:[`${I('a','b')} f = ${I('a','c')} f + ${I('c','b')} f`],b:3}])}
${N(90,560,1100,'La última sirve para <b>cortar</b> una integral: en tramos, en valores absolutos, o donde cambia el signo.',3)}`,
beats:[
`¿Cuándo existe la integral definida? El criterio de integrabilidad dice: si f es continua en el intervalo cerrado a, b, o si tiene solo una cantidad finita de saltos, entonces es integrable. En este curso, casi todas las funciones que vas a ver cumplen esto.`,
`Ahora las propiedades. Si los dos límites son iguales, la integral es cero: no hay ancho. Si das vuelta los límites, la integral cambia de signo. Y la integral de una constante c, de a a b, es c por, b menos a: el área de un rectángulo.`,
`La linealidad, igual que antes: la integral de una suma es la suma de las integrales, y las constantes salen afuera.`,
`Y la propiedad de aditividad: la integral de a a b es la integral de a a c más la integral de c a b. Sirve para cortar una integral en pedazos: cuando f es por tramos, cuando hay un valor absoluto, o cuando f cambia de signo.`]
});

{const g=G(560,600,230,330),f=x=>1/(1+x*x);
S({title:'Estimar una integral sin calcularla',
html:`
${N(90,170,440,'Si <i>m</i> ≤ <i>f</i>(<i>x</i>) ≤ <i>M</i> en [<i>a</i>, <i>b</i>]:',0)}
${Q(90,225,`m(b − a) ≤ ${I('a','b')} f dx ≤ M(b − a)`,0,'xs box')}
${N(90,320,440,'Ejemplo de la clase: <b>∫₀² d<i>x</i>/(1 + <i>x</i>²)</b>',1)}
${N(90,395,440,'<i>f</i> ′ = −2<i>x</i>/(1 + <i>x</i>²)² < 0: decrece. &nbsp;<i>M</i> = <i>f</i>(0) = 1, &nbsp;<i>m</i> = <i>f</i>(2) = 1/5.',2)}
${Q(90,520,`${fr('2','5')} ≤ ${I('0','2')} ${fr('dx','1 + x^2')} ≤ 2`,3,'s box')}
${N(90,620,440,'(el valor real es arctan 2 ≈ 1,107)',4)}
${svg(`
${axes(g,-0.15,2.4,-0.1,1.25,0,{xt:[[1,'1'],[2,'2']],yt:[[1,'1'],[.2,'1/5']]})}
<rect x="${g.X(0)}" y="${g.Y(1)}" width="${g.X(2)-g.X(0)}" height="${g.Y(0)-g.Y(1)}" class="rectn" data-b="3"/>
${sh(regD(g,f,x=>0,0,2),'shade',1)}
<rect x="${g.X(0)}" y="${g.Y(.2)}" width="${g.X(2)-g.X(0)}" height="${g.Y(0)-g.Y(.2)}" class="rect" data-b="3"/>
${cv(g,f,0,2.3,'f1',1)}
`)}`,
beats:[
`Hay otra familia de propiedades, las de comparación. La más útil es esta: si f está entre un mínimo m y un máximo M en todo el intervalo, entonces la integral está entre m por, b menos a, y M por, b menos a. En dibujo: el área queda entre un rectángulo bajito y uno alto.`,
`Ejemplo de la clase: estimar la integral de cero a dos de 1 partido por, 1 más x cuadrado, sin calcularla.`,
`Necesitamos el mínimo y el máximo de f en cero, dos. Es continua en un intervalo cerrado, así que por Weierstrass tiene ambos, y usamos el método del intervalo cerrado del certamen 1. La derivada es menos 2 x partido por, 1 más x cuadrado al cuadrado, que es negativa para x mayor que cero: no hay puntos críticos adentro, y la función decrece. Entonces el máximo es f de cero, que es 1, y el mínimo es f de dos, que es un quinto.`,
`Aplicando la propiedad con b menos a igual a 2: dos quintos es menor o igual que la integral, que es menor o igual que 2. En el dibujo, el área morada queda entre el rectángulo verde y el rojo.`,
`El valor real es arcotangente de 2, más o menos 1 coma 1, y está dentro del rango. Hay un ejercicio parecido en la clase: demostrar que la integral de menos 1 a 1 de raíz de 1 más x cuadrado está entre 2 y 2 raíz de 2. El mínimo es 1 en x igual a cero, y el máximo es raíz de 2 en los extremos.`]
});}

{const g1=G(200,560,85,85),g2=G(540,560,26,35),g3=G(1030,560,62,62);
S({title:'Integrales que se calculan con geometría',
html:`${svg(`
${axes(g1,-1.4,2.5,-0.3,2.6,0,{xt:[[-1,'−1'],[2,'2']],yt:[]})}
${sh(regD(g1,Math.abs,x=>0,-1,2),'shade',0)}${cv(g1,Math.abs,-1.3,2.3,'f1',0)}
${axes(g2,-0.6,11,-0.3,6,1,{xt:[[5,'5'],[10,'10']],yt:[]})}
${sh(regD(g2,x=>Math.abs(x-5),x=>0,0,10),'shade2',1)}${cv(g2,x=>Math.abs(x-5),0,10.5,'f4',1,{lim:5.9})}
${axes(g3,-2.5,2.5,-0.3,2.6,2,{xt:[[-2,'−2'],[2,'2']],yt:[]})}
${sh(regD(g3,x=>Math.sqrt(Math.max(0,4-x*x)),x=>0,-2,2),'shade4',2)}${cv(g3,x=>Math.sqrt(Math.max(0,4-x*x)),-2,2,'f5',2,{n:400})}
`)}
${Q(90,170,`${I('−1','2')} |x| dx = ${fr('1','2')} + 2 = ${fr('5','2')}`,0,'xs')}
${Q(480,170,`${I('0','10')} |x − 5| dx = 2 · ${fr('25','2')} = 25`,1,'xs')}
${Q(880,170,`${I('−2','2')} ${rt('4 − x^2')} dx = ${fr('π · 2^2','2')} = 2π`,2,'xs')}
${N(90,615,1100,'Antes de calcular, <b>dibuja</b>: a veces el área ya la conoces.',3)}`,
beats:[
`Antes de seguir, un recurso que se olvida: si la región es una figura conocida, la integral se calcula con geometría. Ejercicio de la clase: la integral de menos 1 a 2 del valor absoluto de x. El gráfico es una ve, y el área son dos triángulos: uno de base 1 y altura 1, con área un medio, y otro de base 2 y altura 2, con área 2. Total: cinco medios.`,
`La integral de cero a diez del valor absoluto de x menos 5: es una ve con el vértice en 5. Son dos triángulos iguales de base 5 y altura 5, cada uno de área veinticinco medios. Total: 25.`,
`Y la integral de menos 2 a 2 de raíz de 4 menos x cuadrado. Si y es raíz de 4 menos x cuadrado, al elevar al cuadrado queda x cuadrado más y cuadrado igual a 4: un círculo de radio 2. La raíz positiva es la mitad de arriba. Entonces el área es medio círculo: pi por 2 al cuadrado, partido en 2, o sea 2 pi.`,
`Moraleja: antes de lanzarte a calcular, dibuja la región. A veces ya sabes el área, y te ahorras todo el trabajo.`]
});}

/* ===================== TFC ===================== */
CH('Teorema fundamental del cálculo','Clase 12','Capítulo siete: el teorema fundamental del cálculo. Es el puente que une las áreas con las antiderivadas.');

{const g=G(120,600,165,120),f=x=>0.9+0.5*Math.sin(1.7*x)+0.25*x,a=0.3;
S({title:'Una función hecha con una integral',
html:`${svg(`
${axes(g,-0.2,3.7,-0.2,3.3,0,{xt:[[a,'a']],yt:[],xl:'t',yl:false})}
<path id="acc" class="shade"/>
${cv(g,f,0,3.5,'f1',0)}${tc(g.X(3.45),g.Y(f(3.45))-26,'f(t)','f1',0,'end',24)}
<line id="accl" class="ln2" style="stroke:var(--f5);stroke-width:3"/>
<text id="accx" class="lab" text-anchor="middle" dominant-baseline="central" style="fill:var(--f5);font-size:26px">x</text>
`)}
${Q(800,180,`g(x) = ${I('a','x')} f(t) dt`,0,'box')}
${N(800,290,410,'El área desde <i>a</i> hasta <i>x</i>. Si <i>x</i> se mueve, el área cambia: es una <b>función de <i>x</i></b>.',1)}
<div class="eq s" style="left:800px;top:430px" data-b="2"><i>g</i>(<i>x</i>) ≈ <span id="accv">0</span></div>
${N(800,510,410,'Pregunta: ¿cuál es su <b>derivada</b>? O sea, ¿qué tan rápido crece el área?',3)}`,
beats:[
`Antes del teorema, una idea nueva: una función definida con una integral. Fija un punto a, y define g de x como la integral de a hasta x de f de t, d t. Usamos t como variable de integración para no confundirla con el x del límite.`,
`¿Qué significa? g de x es el área bajo la curva, desde a hasta x. Mira el dibujo: el punto x se mueve, y el área sombreada crece o se achica. Para cada x hay un área distinta. Eso es una función de x.`,
`Aquí ves el valor aproximado de g de x mientras x se mueve. Cuando x vuelve hacia a, el área se hace cero.`,
`La gran pregunta es: ¿cuál es la derivada de g? Dicho de otra forma: cuando x avanza un poquito, ¿qué tan rápido crece el área? La respuesta es uno de los resultados más importantes de las matemáticas.`],
loop(st,r){const x=a+0.2+(2.9)*(0.5-0.5*Math.cos(st*.55));setD(r,'acc',regD(g,f,t=>0,a,x,80));setL(r,'accl',g.X(x),g.Y(0),g.X(x),g.Y(f(x)));const e=r.querySelector('#accx');if(e){e.setAttribute('x',g.X(x));e.setAttribute('y',g.Y(0)+26)}
  let s=0;const N=60;for(let i=0;i<N;i++){s+=f(a+(x-a)*(i+.5)/N)}setTx(r,'accv',(s*(x-a)/N).toFixed(2).replace('.',','))}
});}

{const g=G(120,600,175,130),f=x=>0.9+0.5*Math.sin(1.7*x)+0.25*x,a=0.3,x0=1.9,h=.28;
S({title:'TFC1: derivar la integral',
html:`${svg(`
${axes(g,-0.2,3.3,-0.2,3.0,0,{xt:[[a,'a'],[x0,'x'],[x0+h+.12,'x + h']],yt:[],xl:'t',yl:false})}
${sh(regD(g,f,t=>0,a,x0),'shade',0)}
${sh(regD(g,f,t=>0,x0,x0+h),'shade4',1)}
${cv(g,f,0,3.1,'f1',0)}
${tc(g.X(x0+h/2),g.Y(f(x0))+40,'≈ f(x)·h','f5',1,'middle',22)}
`)}
${Q(760,175,`g(x + h) − g(x) = ${I('x','x + h')} f(t) dt ≈ f(x) · h`,1,'xs')}
${Q(760,265,`${fr('g(x + h) − g(x)','h')} ≈ f(x)`,2,'s')}
${Q(760,375,'g′(x) = f(x)',3,'l box')}
${N(760,470,450,'<b>TFC1:</b> si <i>f</i> es continua en [<i>a</i>, <i>b</i>], <i>g</i> es continua, derivable en ]<i>a</i>, <i>b</i>[ y <i>g</i> ′ = <i>f</i>.',3)}
${Q(760,590,`${fr('d','dx')} ${I('a','x')} f(t) dt = f(x)`,4,'s')}`,
beats:[
`Veamos por qué. Tomamos el área hasta x, en morado.`,
`Si avanzamos de x a x más h, el área crece en la franja naranja. Esa franja es la integral de x a x más h, de f. Y como la franja es muy delgada, es casi un rectángulo de base h y altura f de x. Entonces g de x más h menos g de x es aproximadamente f de x por h.`,
`Dividimos por h: el cociente, g de x más h menos g de x, partido por h, es aproximadamente f de x. Y ese cociente es justamente el de la definición de derivada.`,
`Cuando h tiende a cero, la aproximación se vuelve exacta, y queda: g prima de x es igual a f de x. Ese es el teorema fundamental del cálculo, primera parte, o TFC uno: si f es continua en a, b, la función g es continua, derivable, y su derivada es f. En la clase se demuestra encerrando la franja entre el mínimo m y el máximo M de f en ese pedacito, igual que en la estimación que vimos antes.`,
`En palabras: la derivada de una integral, con respecto a su límite de arriba, es el integrando evaluado en ese límite. Derivar deshace integrar. Con notación de Leibniz: d sobre d x de la integral de a a x de f de t, es f de x.`]
});}

S({title:'Ejemplos y la regla de Leibniz',
html:`
${Q(90,175,`g(x) = ${I('0','x')} ${rt('1 + t^2')} dt   ⇒   g′(x) = ${rt('1 + x^2')}`,0,'s')}
${N(90,250,1100,'No hay que calcular la integral: basta reemplazar <i>t</i> por <i>x</i>.',0)}
${P(90,330,'Regla de Leibniz','acc',1)}
${Q(90,390,`${fr('d','dx')} ${I('g(x)','h(x)')} f(t) dt = f(h(x)) · h′(x) − f(g(x)) · g′(x)`,1,'s box')}
${N(90,495,1100,'Sale de TFC2 + regla de la cadena: <i>F</i>(<i>h</i>(<i>x</i>)) − <i>F</i>(<i>g</i>(<i>x</i>)), y se deriva.',2)}
${Q(90,575,`${fr('d','dx')} ${I('x^2','x^3')} sen(t) dt = sen(x^3) · 3x^2 − sen(x^2) · 2x`,3,'s')}`,
beats:[
`Ejemplo de la clase: g de x igual a la integral de cero a x de raíz de, 1 más t cuadrado. Esa integral es difícil de calcular, pero no importa: la función es continua, así que por TFC uno, g prima de x es simplemente raíz de, 1 más x cuadrado. Basta reemplazar t por x.`,
`¿Y si los límites no son solo x? La regla de Leibniz: la derivada de la integral desde g de x hasta h de x de f de t, es f evaluada en el límite de arriba por la derivada del límite de arriba, menos f evaluada en el límite de abajo por la derivada del límite de abajo.`,
`De dónde sale: si F es una antiderivada de f, la integral es F de h de x menos F de g de x, y al derivar con la regla de la cadena aparecen las derivadas h prima y g prima.`,
`Un ejemplo: la derivada de la integral de x cuadrado a x cubo de seno de t, es seno de x cubo por 3 x cuadrado, menos seno de x cuadrado por 2 x. El error típico es olvidar multiplicar por la derivada del límite. No lo olvides.`]
});

S({title:'Ejemplo: recta tangente a una integral',
html:`
${Q(90,170,`f(x) = 2 − ${I('2','x + 1')} ${fr('9','1 + t')} dt,      {{en}} x = 1`,0,'s')}
${Q(90,275,`f(1) = 2 − ${I('2','2')} ${fr('9','1 + t')} dt = 2 − 0 = 2`,1,'s')}
${Q(90,370,`f′(x) = −${fr('9','1 + (x + 1)')} · 1 = −${fr('9','x + 2')}`,2,'s')}
${Q(90,470,'f′(1) = −3',3,'s')}
${Q(90,560,'y − 2 = −3(x − 1)   ⇔   y = −3x + 5',4,'s box')}
${N(700,470,500,'Recta tangente: <i>y</i> − <i>f</i>(1) = <i>f</i> ′(1)(<i>x</i> − 1).',4)}`,
beats:[
`Ejemplo de la clase: hallar la recta tangente a f de x igual a 2 menos la integral de 2 a x más 1 de 9 partido por, 1 más t, en x igual a 1. Para una recta tangente necesitamos un punto y una pendiente: f de 1 y f prima de 1.`,
`Primero f de 1. Reemplazamos x por 1: el límite de arriba es 1 más 1, o sea 2. La integral de 2 a 2 es cero, porque los límites son iguales. Entonces f de 1 es 2 menos cero, que es 2.`,
`Ahora la derivada. El 2 es constante y su derivada es cero. Para la integral usamos Leibniz: el integrando evaluado en el límite de arriba, x más 1, por la derivada de x más 1, que es 1. El límite de abajo es constante, así que no aporta. Queda f prima de x igual a menos 9 partido por, 1 más x más 1, o sea menos 9 partido por x más 2.`,
`Evaluamos en x igual a 1: menos 9 partido por 3, que es menos 3. Esa es la pendiente.`,
`La recta tangente, con la forma punto pendiente: y menos 2 es igual a menos 3 por, x menos 1. Despejando: y igual a menos 3 x más 5.`]
});

S({title:'Ejercicio: demostrar 4F′(1) − F″(1) = 2e',
html:`
${Q(90,170,`F(x) = ${I('x^2','x + 1')} e^{t^2} dt`,0,'s')}
${Q(90,265,'F′(x) = e^{(x+1)^2} · 1 − e^{x^4} · 2x',1,'s')}
${Q(90,340,'F′(1) = e^4 − 2e',1,'s')}
${Q(90,420,'F″(x) = 2(x + 1) e^{(x+1)^2} − 2e^{x^4} − 8x^4 e^{x^4}',2,'s')}
${Q(90,495,'F″(1) = 4e^4 − 2e − 8e = 4e^4 − 10e',3,'s')}
${Q(90,580,'4F′(1) − F″(1) = 4e^4 − 8e − 4e^4 + 10e = 2e',4,'s box')}`,
beats:[
`Un ejercicio de la clase: F de x es la integral de x cuadrado a x más 1 de e a la t cuadrado. Demostrar que 4 F prima de 1, menos F segunda de 1, es 2 e. La integral de e a la t cuadrado no se puede calcular con funciones elementales, así que la única forma es Leibniz.`,
`F prima de x: el integrando en el límite de arriba, e a la, x más 1 al cuadrado, por la derivada de x más 1, que es 1. Menos el integrando en el límite de abajo: x cuadrado al cuadrado es x a la cuarta, así que e a la x a la cuarta, por la derivada de x cuadrado, 2 x. En x igual a 1: e a la 4, menos 2 e.`,
`Ahora F segunda: derivamos F prima. El primer término, e a la, x más 1 al cuadrado, se deriva con la cadena: queda 2 por x más 1 por e a la, x más 1 al cuadrado. El segundo, 2 x por e a la x a la cuarta, es un producto: 2 por e a la x a la cuarta, más 2 x por 4 x cubo por e a la x a la cuarta. Con el signo menos adelante quedan los dos restando.`,
`Evaluamos en 1: el primer término da 2 por 2 por e a la 4, o sea 4 e a la 4. Después menos 2 e, y menos 8 e. Total: 4 e a la 4 menos 10 e.`,
`Finalmente: 4 por, e a la 4 menos 2 e, es 4 e a la 4 menos 8 e. Le restamos F segunda de 1: menos 4 e a la 4, más 10 e. Los e a la 4 se cancelan, y queda 2 e. Demostrado.`]
});

S({title:'Ejemplo: hallar f y el número a',
html:`
${Q(90,170,`6 + ${I('a','x')} ${fr('f(t)','t^2')} dt = 2${rt('x')},      x > 0`,0,'s')}
${Q(90,275,`{{derivamos:}}   0 + ${fr('f(x)','x^2')} = ${fr('1',rt('x'))}   ⇒   f(x) = x^{3/2}`,1,'s')}
${Q(90,385,`6 + ${I('a','x')} ${fr('t^{3/2}','t^2')} dt = 6 + ${I('a','x')} t^{−1/2} dt = 6 + 2${rt('x')} − 2${rt('a')}`,2,'s')}
${Q(90,495,`6 + 2${rt('x')} − 2${rt('a')} = 2${rt('x')}   ⇒   ${rt('a')} = 3   ⇒   a = 9`,3,'s')}
${Q(90,590,'f(x) = x^{3/2},     a = 9',4,'s box')}`,
beats:[
`Otro ejemplo de la clase, de los que preguntan: encontrar una función f y un número a tales que 6 más la integral de a a x de f de t partido por t cuadrado, sea igual a 2 raíz de x, para todo x positivo.`,
`La estrategia es derivar ambos lados con respecto a x. La derivada de 6 es cero. La derivada de la integral, por TFC uno, es el integrando evaluado en x: f de x partido por x cuadrado. Y la derivada de 2 raíz de x es 1 partido por raíz de x. Despejando, f de x es x cuadrado partido por raíz de x, o sea x a la tres medios.`,
`Ahora que conocemos f, la reemplazamos en la igualdad original para encontrar a. t a la tres medios partido por t cuadrado es t a la menos un medio. Su antiderivada es 2 raíz de t. Por TFC dos, que vemos en un momento, la integral de a a x es 2 raíz de x menos 2 raíz de a.`,
`La igualdad queda: 6 más 2 raíz de x menos 2 raíz de a, igual a 2 raíz de x. Los 2 raíz de x se cancelan, y queda 6 igual a 2 raíz de a. Raíz de a es 3, y a es 9.`,
`Respuesta: f de x es x a la tres medios, y a es 9. Truco general: si hay una integral con x en el límite, derivar elimina la integral.`]
});

S({title:'TFC2: calcular integrales definidas',
html:`
${Q(640,175,`${I('a','b')} f(x) dx = F(b) − F(a) = F(x)${EV('a','b')}`,0,'l c box')}
${N(90,280,1100,'Donde <i>F</i> es <b>cualquier</b> antiderivada de <i>f</i>, y <i>f</i> es continua en [<i>a</i>, <i>b</i>].',0)}
${N(90,350,1100,'<b>Por qué:</b> <i>g</i>(<i>x</i>) = ∫<sub><i>a</i></sub><sup><i>x</i></sup> <i>f</i> es antiderivada (TFC1). Si <i>F</i> es otra, <i>F</i> = <i>g</i> + <i>C</i>, y',1)}
${Q(90,420,'F(b) − F(a) = (g(b) + C) − (g(a) + C) = g(b) − 0',1,'s')}
${Q(90,525,`${I('0','1')} x^2 dx = ${fr('x^3','3')}${EV('0','1')} = ${fr('1','3')} − 0 = ${fr('1','3')}`,2,'s')}
${N(760,535,440,'El <b>+ <i>C</i></b> se cancela: no se escribe.',3)}`,
beats:[
`Ahora la segunda parte del teorema, TFC dos, que es la que se usa para calcular. Si f es continua en a, b, la integral de a a b de f es F de b menos F de a, donde F es cualquier antiderivada de f. Se anota también con una barra vertical: F de x evaluada entre a y b.`,
`Por qué funciona: por TFC uno, la función g de x, la integral de a a x, es una antiderivada de f. Si F es cualquier otra, difieren en una constante: F es g más C. Entonces F de b menos F de a es, g de b más C, menos, g de a más C. Las C se cancelan, y g de a es cero, porque es una integral con límites iguales. Queda g de b, que es justamente la integral de a a b.`,
`Ejemplo de la clase: el área bajo x cuadrado entre cero y uno. Una antiderivada de x cuadrado es x cubo tercios. Evaluamos: en 1 da un tercio, en cero da cero. El área es un tercio. Compara con todo el trabajo de las sumas de Riemann.`,
`Fíjate que aquí no se escribe el más C: como se cancela siempre, da lo mismo qué antiderivada uses.`]
});

{const g=G(800,450,105,30),f=x=>x*x*x-6*x;
S({title:'Riemann contra TFC2',
html:`
${Q(90,165,`${I('0','3')} (x^3 − 6x) dx`,0,'s')}
${N(90,240,620,'<b>Riemann</b> (regular, derechos): Δ<i>x</i> = 3/<i>n</i>, &nbsp;<i>x<sub>k</sub></i> = 3<i>k</i>/<i>n</i>.',1)}
${Q(90,305,`Σ (${fr('27k^3','n^3')} − ${fr('18k','n')}) ${fr('3','n')} = ${fr('81','n^4')} Σ k^3 − ${fr('54','n^2')} Σ k`,1,'xs')}
${Q(90,400,`Σ k = ${fr('n(n + 1)','2')},    Σ k^3 = (${fr('n(n + 1)','2')})^2`,2,'xs')}
${Q(90,490,`= ${fr('81','4')}(1 + ${fr('1','n')})^2 − 27(1 + ${fr('1','n')})  →  ${fr('81','4')} − 27 = −${fr('27','4')}`,3,'xs')}
${Q(90,590,`{{TFC2:}}  (${fr('x^4','4')} − 3x^2)${EV('0','3')} = ${fr('81','4')} − 27 = −${fr('27','4')}`,4,'xs box')}
${svg(`${axes(g,-0.3,3.5,-6.4,9.8,5,{xt:[[3,'3']],yt:[[9,'9'],[-5,'−5']]})}
${sh(regD(g,x=>Math.min(0,f(x)),x=>0,0,Math.sqrt(6)),'shade3',5)}${sh(regD(g,x=>Math.max(0,f(x)),x=>0,Math.sqrt(6),3),'shade2',5)}
${cv(g,f,0,3.15,'f1',0,{lim:9.7})}${tc(g.X(1.3),g.Y(-2.6),'−','f6',5,'middle',40)}${tc(g.X(2.75),g.Y(2.6),'+','f4',5,'middle',36)}`)}`,
beats:[
`Ejemplo de la clase: calcular la integral de cero a tres de, x cubo menos 6 x, de dos maneras: con sumas de Riemann y con TFC dos. Así ves por qué TFC dos es tan valioso.`,
`Con Riemann, partición regular con n pedazos: delta x es 3 partido por n, y tomamos los extremos derechos, x k igual a 3 k partido por n. Evaluamos f: 3 k sobre n al cubo es 27 k cubo partido por n cubo, menos 6 por 3 k sobre n, que es 18 k partido por n. Multiplicamos por 3 partido por n y separamos las sumas: 81 partido por n a la cuarta, por la suma de k cubo, menos 54 partido por n cuadrado, por la suma de k.`,
`Necesitamos dos fórmulas de sumatorias: la suma de k de 1 a n es n por n más 1, partido en 2. Y la suma de k cubo es el cuadrado de eso.`,
`Reemplazando y simplificando, queda 81 cuartos por, 1 más 1 partido por n, al cuadrado, menos 27 por, 1 más 1 partido por n. Cuando n tiende a infinito, 1 partido por n tiende a cero, y el límite es 81 cuartos menos 27, que es menos 27 cuartos.`,
`Con TFC dos es mucho más rápido: la antiderivada es x a la cuarta partido en 4, menos 3 x cuadrado. En 3: 81 cuartos menos 27. En cero: cero. Resultado: menos 27 cuartos. Igual que antes.`,
`¿Y por qué es negativa? Mira el gráfico: entre cero y raíz de 6 la función está bajo el eje, y esa parte roja es más grande que la parte verde de arriba. La integral es un área con signo, así que da negativo.`]
});}

html:`

`Los métodos de integración también funcionan con límites. Ejemplo de la clase: la integral de cero a uno de 2 x cubo por raíz de, 3 x a la cuarta más 1.`,
`Sustitución: u igual a 3 x a la cuarta más 1, d u igual a 12 x cubo d x. Entonces 2 x cubo d x es d u partido en 6. Y lo nuevo: cambiamos también los límites. Cuando x es cero, u es 1. Cuando x es uno, u es 4.`,
`La integral queda un sexto de la integral de 1 a 4 de raíz de u. La antiderivada es dos tercios de u a la tres medios. Evaluada: 4 a la tres medios es 8, y 1 a la tres medios es 1. Total: un sexto por dos tercios por 7, que es siete novenos. Al cambiar los límites, no hace falta volver a x.`,
`Segundo ejemplo: la integral de cero a pi medios de x coseno de 3 x. Por partes: u igual a x, d v igual a coseno de 3 x d x. Entonces d u es d x, y v es seno de 3 x partido en 3.`,
`La fórmula con límites: u v evaluado entre los límites, menos la integral de v d u. El primer término: en pi medios, pi medios por seno de 3 pi medios, partido en 3. Seno de 3 pi medios es menos 1, así que da menos pi sextos. En cero da cero. Y la integral de seno de 3 x es menos coseno de 3 x partido en 3, que con el menos un tercio de adelante da más coseno de 3 x partido en 9.`,
`Evaluamos: coseno de 3 pi medios es cero, y coseno de cero es 1. Queda cero menos 1, partido en 9. Resultado: menos pi sextos menos un noveno.`]
});

${sh(regY(g,y=>y+2,y=>y*y,0,2),'shade4',1)}
${cv(g,x=>Math.sqrt(Math.max(0,x)),0,4.5,'f1',0)}${cv(g,x=>x-2,1.6,4.5,'f2',0)}
<rect id="hy_r" class="rect" data-b="2"/>
${tc(g.X(.5),g.Y(1.1),'x = y²','f1',0,'end',22)}${tc(g.X(3.45),g.Y(0.95),'x = y + 2','f2',0,'start',22)}
`)}
${Q(760,175,`y = ${rt('x')} ⇔ x = y^2,     y = x − 2 ⇔ x = y + 2`,0,'xs')}
${N(760,245,450,'Rectángulos <b>horizontales</b>: <b>derecha menos izquierda</b>.',1)}
${Q(760,340,`A = ${I('0','2')} [(y + 2) − y^2] dy`,2,'s')}
${Q(760,440,`= (${fr('y^2','2')} + 2y − ${fr('y^3','3')})${EV('0','2')} = 2 + 4 − ${fr('8','3')} = ${fr('10','3')}`,3,'xs box')}
${N(760,560,450,'Elige la variable que dé <b>menos pedazos</b>.',3)}`,
beats:[
`Ese mismo ejemplo sale más rápido si integramos con respecto a y. Despejamos x en cada curva: de y igual a raíz de x, sale x igual a y cuadrado. Y de y igual a x menos 2, sale x igual a y más 2.`,
`Ahora usamos rectángulos horizontales, de alto d y. Su largo es la distancia entre la curva de la derecha y la de la izquierda. En vez de arriba menos abajo, es derecha menos izquierda. Y aquí, para todo y entre cero y 2, la derecha es siempre la recta y la izquierda es siempre la parábola: no hay que partir.`,
`El área es la integral de cero a 2 de, y más 2, menos y cuadrado, d y. Los límites son los valores de y: el eje x es y igual a cero, y la intersección es en y igual a 2.`,
`La antiderivada: y cuadrado medios más 2 y menos y cubo tercios. En 2: 2 más 4 menos ocho tercios, que es diez tercios. Igual que antes, pero en un solo paso. Consejo: antes de integrar, mira si en x o en y la región se describe con menos pedazos.`],
loop(st,r){const c=.15+1.7*(0.5-0.5*Math.cos(st*.6)),w=.09;const e=r.querySelector('#hy_r');if(e){e.setAttribute('x',g.X(c*c));e.setAttribute('width',g.X(c+2)-g.X(c*c));e.setAttribute('y',g.Y(c+w/2));e.setAttribute('height',g.Y(c-w/2)-g.Y(c+w/2))}}
});}

{const g=G(330,350,95,34),f=x=>x*x*x,L=x=>3*x-2;
S({title:'Ejercicio: la recta tangente a x³',
html:`${svg(`
${axes(g,-2.6,2.2,-8.6,5,0,{xt:[[-2,'−2'],[1,'1']],yt:[]})}
${sh(regD(g,f,L,-2,1),'shade',3)}
${cv(g,f,-2.1,1.7,'f1',0,{lim:4.9})}${cv(g,L,-2.4,2.1,'f2',1,{lim:8.5})}
${fdot(g.X(1),g.Y(1),'f5',1)}${fdot(g.X(-2),g.Y(-8),'f5',2)}
${tc(g.X(1)+14,g.Y(1)+22,'(1, 1)','f5',1,'start',22)}${tc(g.X(-2)+14,g.Y(-8)+6,'(−2, −8)','f5',2,'start',22)}
`)}
${Q(680,170,"f′(x) = 3x^2,  f′(1) = 3  ⇒  L: y = 3x − 2",1,'s')}
${Q(680,250,'x^3 − 3x + 2 = (x − 1)^2 (x + 2)',2,'s')}
${N(680,320,520,'En <i>x</i> = 0: cúbica 0, recta −2 ⇒ <b>arriba la cúbica</b>.',3)}
${Q(680,410,`A = ${I('−2','1')} (x^3 − 3x + 2) dx`,3,'s')}
${Q(680,500,`= (${fr('x^4','4')} − ${fr('3x^2','2')} + 2x)${EV('−2','1')} = ${fr('3','4')} − (−6) = ${fr('27','4')}`,4,'xs box')}`,
beats:[
`Ejercicio propuesto de la clase: f de x es x al cubo, y L es la recta tangente en el punto 1, 1. Calcular el área entre f y L, sabiendo que se cortan en el punto de tangencia y en menos 2, menos 8.`,
`Primero la recta. La derivada es 3 x cuadrado, y en x igual a 1 vale 3. La recta tangente: y menos 1 igual a 3 por x menos 1, o sea y igual a 3 x menos 2.`,
`Verificamos las intersecciones: x cubo igual a 3 x menos 2, o sea x cubo menos 3 x más 2 igual a cero. Se factoriza como x menos 1 al cuadrado por x más 2. La raíz x igual a 1 es doble, porque ahí la recta es tangente. Y la otra es x igual a menos 2. Coincide con el enunciado.`,
`¿Quién está arriba entre menos 2 y 1? En x igual a cero, la cúbica vale cero y la recta menos 2. Arriba la cúbica. El área es la integral de menos 2 a 1 de x cubo menos, 3 x menos 2: o sea x cubo menos 3 x más 2.`,
`La antiderivada: x a la cuarta partido en 4, menos 3 x cuadrado medios, más 2 x. En 1: un cuarto menos tres medios más 2, que es tres cuartos. En menos 2: 4 menos 6 menos 4, que es menos 6. Restando: tres cuartos más 6, veintisiete cuartos.`]
});}

{const g=G(120,600,165,95),f=x=>1+0.9*Math.sin(1.3*x)+0.3*x,a=0.2,b=3.6;
S({title:'Longitud de arco: de dónde sale la fórmula',
html:`${svg(`
${axes(g,-0.1,3.9,-0.2,3.5,0,{xt:[[a,'a'],[b,'b']],yt:[]})}
${cv(g,f,a,b,'f1',0,{w:5,op:.55})}
<polyline id="poly" class="ln" style="stroke:var(--f5);stroke-width:3"/>
<g id="polyd"></g>
`)}
${N(820,170,400,'Aproximamos la curva con <b>segmentos</b>.',0)}
<div class="eq s" style="left:820px;top:260px" data-b="0"><i>n</i> = <span id="pl_n">2</span></div>
${Q(820,330,`|P_{k−1}P_k| = ${rt('Δx^2 + Δy_k^2')}`,1,'xs')}
${N(820,395,400,'TVM: Δ<i>y<sub>k</sub></i> = <i>f</i> ′(<i>x<sub>k</sub></i>*) Δ<i>x</i>',2)}
${Q(820,455,`= ${rt('1 + f′(x_k^{*})^2')} Δx`,2,'xs')}
${Q(820,545,`L = ${I('a','b')} ${rt('1 + [f′(x)]^2')} dx`,3,'s box')}
${N(820,635,400,'Pide <i>f</i> ′ continua.',3)}`,
beats:[
`Ahora, ¿cómo se mide el largo de una curva? Misma idea de siempre: aproximar con pedacitos. Aquí, con segmentos rectos que unen puntos de la curva. Mira cómo, con más segmentos, la poligonal se pega a la curva.`,
`Cada segmento va de un punto a otro: avanza delta x en horizontal y delta y en vertical. Por Pitágoras, su largo es raíz de, delta x cuadrado más delta y cuadrado.`,
`Ahora el truco: por el teorema del valor medio, delta y es f prima en algún punto intermedio, por delta x. Reemplazando y sacando delta x de la raíz, el largo del segmento es raíz de, 1 más f prima al cuadrado, por delta x.`,
`Sumando todos los segmentos y llevando al límite, aparece la integral. La longitud de arco de y igual a f de x, entre a y b, es la integral de a a b de raíz de, 1 más f prima de x al cuadrado, d x. Pide que la derivada sea continua.`],
on(j,r){const n=[3,6,6,24][j]||3;const pts=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;pts.push(g.X(x).toFixed(1)+','+g.Y(f(x)).toFixed(1))}const e=r.querySelector('#poly');if(e)e.setAttribute('points',pts.join(' '));const d=r.querySelector('#polyd');if(d)d.innerHTML=pts.map(p=>{const[x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="5" style="fill:var(--f5)"/>`}).join('');setTx(r,'pl_n',String(n))}
});}

S({title:'Ejemplo: un cuadrado perfecto escondido',
html:`
${Q(90,170,`y = ${fr('x^3','12')} + ${fr('1','x')},   x ∈ [1, 2]       y′ = ${fr('x^2','4')} − ${fr('1','x^2')}`,0,'s')}
${Q(90,275,`(y′)^2 = ${fr('x^4','16')} − ${fr('1','2')} + ${fr('1','x^4')}`,1,'s')}
${Q(90,370,`1 + (y′)^2 = ${fr('x^4','16')} + ${fr('1','2')} + ${fr('1','x^4')} = (${fr('x^2','4')} + ${fr('1','x^2')})^2`,2,'s')}
${Q(90,480,`L = ${I('1','2')} (${fr('x^2','4')} + ${fr('1','x^2')}) dx = (${fr('x^3','12')} − ${fr('1','x')})${EV('1','2')} = ${fr('13','12')}`,3,'s box')}
${N(90,600,1100,'Típico de certamen: al sumar 1, el <b>−</b> del medio pasa a <b>+</b> y queda un cuadrado de binomio.',4)}`,
beats:[
`Ejemplo de la clase: la longitud de y igual a x cubo partido por 12, más 1 partido por x, entre x igual a 1 y x igual a 2. Derivamos: x cuadrado partido en 4, menos 1 partido por x cuadrado.`,
`Elevamos al cuadrado con el cuadrado de binomio: el primero al cuadrado, x a la cuarta partido por 16. Menos dos veces el primero por el segundo: 2 por x cuadrado cuartos por 1 partido por x cuadrado, que es un medio. Y más el segundo al cuadrado, 1 partido por x a la cuarta.`,
`Al sumar 1, el menos un medio se transforma en más un medio. Y eso es otra vez un cuadrado de binomio, pero con suma: x cuadrado cuartos más 1 partido por x cuadrado, todo al cuadrado.`,
`La raíz se va con el cuadrado, y queda la integral de 1 a 2 de, x cuadrado cuartos más 1 partido por x cuadrado. La antiderivada: x cubo partido por 12 menos 1 partido por x. En 2: ocho doceavos menos un medio, un sexto. En 1: un doceavo menos 1, menos once doceavos. Restando: un sexto más once doceavos, trece doceavos.`,
`Este truco es típico de los ejercicios de longitud de arco: las funciones se eligen para que, al sumar 1, el término del medio cambie de signo y aparezca un cuadrado perfecto. Si ves algo así, búscalo.`]
});

S({title:'Ejemplo: y = ln(1 − x²)',
html:`
${Q(90,170,`y′ = −${fr('2x','1 − x^2')}     1 + (y′)^2 = ${fr('(1 − x^2)^2 + 4x^2','(1 − x^2)^2')} = (${fr('1 + x^2','1 − x^2')})^2`,0,'s')}
${Q(90,290,`${fr('1 + x^2','1 − x^2')} = −1 + ${fr('2','1 − x^2')} = −1 + ${fr('1','1 − x')} + ${fr('1','1 + x')}`,1,'s')}
${Q(90,400,`L = ${I('0','1/2')} (−1 + ${fr('1','1 − x')} + ${fr('1','1 + x')}) dx`,2,'s')}
${Q(90,500,`= (−x − ln|1 − x| + ln|1 + x|)${EV('0','1/2')}`,3,'s')}
${Q(90,590,`= −${fr('1','2')} − ln ${fr('1','2')} + ln ${fr('3','2')} = ln 3 − ${fr('1','2')}`,4,'s box')}`,
beats:[
`Otro ejemplo de la clase, que junta todo: la longitud de y igual a logaritmo de, 1 menos x cuadrado, entre cero y un medio. La derivada es menos 2 x partido por, 1 menos x cuadrado. Al cuadrado: 4 x cuadrado partido por, 1 menos x cuadrado al cuadrado. Sumamos 1 con denominador común: arriba queda, 1 menos x cuadrado al cuadrado más 4 x cuadrado. Desarrollando, 1 menos 2 x cuadrado más x a la cuarta más 4 x cuadrado, que es 1 más 2 x cuadrado más x a la cuarta: el cuadrado de, 1 más x cuadrado. Otro cuadrado perfecto.`,
`La raíz da, 1 más x cuadrado, partido por, 1 menos x cuadrado. Es una fracción impropia: grado 2 arriba y abajo. Dividimos: da menos 1 más 2 partido por, 1 menos x cuadrado. Y esa última fracción, por fracciones parciales, es 1 partido por 1 menos x, más 1 partido por 1 más x.`,
`La longitud es la integral de cero a un medio de esas tres fracciones.`,
`Integramos: menos 1 da menos x. 1 partido por 1 menos x da menos logaritmo de 1 menos x: ojo con el signo, por la regla de la cadena. Y 1 partido por 1 más x da logaritmo de 1 más x.`,
`Evaluamos: en un medio, menos un medio, menos logaritmo de un medio, más logaritmo de tres medios. En cero todo da cero. Por propiedades: menos logaritmo de un medio más logaritmo de tres medios es logaritmo de tres medios dividido por un medio, o sea logaritmo de 3. Resultado: logaritmo de 3 menos un medio.`]
});

/* ===================== PARAMÉTRICAS ===================== */
CH('Curvas paramétricas','Clase 14','Capítulo nueve: curvas paramétricas. Una curva descrita por un punto que se mueve en el tiempo.');

{const g=G(380,400,95,48),X=t=>t*t,Y=t=>t*t*t-3*t;
S({title:'¿Qué es una curva paramétrica?',
html:`${svg(`
${axes(g,-0.6,4.8,-4.4,4.4,0,{xt:[[3,'3']],yt:[]})}
${pc(g,X,Y,-2.1,2.1,'f1',0,{op:.85})}
<circle id="pp_p" r="10" style="fill:var(--f5)"/>
<text id="pp_t" class="lab" dominant-baseline="central" style="fill:var(--f5);font-size:24px"></text>
${fdot(g.X(X(-2.1)),g.Y(Y(-2.1)),'f4',2,8)}${fdot(g.X(X(2.1)),g.Y(Y(2.1)),'f6',2,8)}
${tc(g.X(X(-2.1))-12,g.Y(Y(-2.1)),'inicio','f4',2,'end',22)}${tc(g.X(X(2.1))-12,g.Y(Y(2.1)),'final','f6',2,'end',22)}
`)}
${Q(860,175,`C: ${cs([['x = x(t)',''],['y = y(t)','']]).replace(/<span><span class="w">si<\/span> <\/span>/g,'<span></span>')}  t ∈ I`,0,'s')}
${N(860,290,360,'<i>t</i> es el <b>parámetro</b> (piensa en el tiempo). En cada instante, el punto está en (<i>x</i>(<i>t</i>), <i>y</i>(<i>t</i>)).',1)}
${N(860,430,360,'Si <i>I</i> = [<i>a</i>, <i>b</i>]: <b>punto inicial</b> en <i>t</i> = <i>a</i>, <b>final</b> en <i>t</i> = <i>b</i>.',2)}
${N(860,540,360,'Puede volver atrás o <b>cruzarse</b>: no es el gráfico de una función.',3)}
${Q(120,640,'x = t^2,   y = t^3 − 3t',0,'xs')}`,
beats:[
`Hasta ahora vimos curvas dadas como y igual a f de x, y curvas implícitas, como x cuadrado más y cuadrado igual a 1. Ahora una tercera forma: las curvas paramétricas. Las dos coordenadas, x e y, dependen de una tercera variable t.`,
`La variable t se llama parámetro, y conviene pensarla como el tiempo. Para cada instante t, la partícula está en el punto x de t, y de t. A medida que t avanza, el punto se mueve y va dibujando la curva. Aquí ves el ejemplo x igual a t cuadrado, y igual a t cubo menos 3 t.`,
`Si el parámetro recorre un intervalo cerrado a, b, el punto en t igual a a es el punto inicial, y en t igual a b es el punto final. Las ecuaciones junto con el intervalo forman la parametrización de la curva.`,
`Fíjate que esta curva se cruza a sí misma. No es el gráfico de una función de x, porque para un mismo x hay varios y. Las paramétricas permiten describir curvas que con y igual a f de x serían imposibles.`],
loop(st,r){const t=-2.1+4.2*((st*.18)%1);const x=g.X(X(t)),y=g.Y(Y(t));setT(r,'pp_p',x,y);const e=r.querySelector('#pp_t');if(e){e.setAttribute('x',x+16);e.setAttribute('y',y-20);e.textContent='t = '+t.toFixed(1).replace('.',',').replace('-','−')}}
});}

{const g1=G(150,480,70,70),g2=G(640,420,60,60),g3=G(1040,420,60,60);
S({title:'Tres parametrizaciones clásicas',
html:`${svg(`
<g data-b="1">${pth(`M${g1.X(0.3)} ${g1.Y(0.5)} L${g1.X(4)} ${g1.Y(3.4)}`,null,'ln','stroke:var(--f2);stroke-width:4')}${fdot(g1.X(.3),g1.Y(.5),'f4',null,8)}${fdot(g1.X(4),g1.Y(3.4),'f6',null,8)}${tc(g1.X(.3)-10,g1.Y(.5)+20,'A','f4',null,'end',24)}${tc(g1.X(4)+10,g1.Y(3.4)-16,'B','f6',null,'start',24)}<circle id="c1" r="9" style="fill:var(--f5)"/></g>
<g data-b="2">${cir(g2.X(0),g2.Y(0),120,null,'ln2')}<circle cx="${g2.X(0)}" cy="${g2.Y(0)}" r="120" class="ln" style="stroke:var(--f1);stroke-width:4;fill:none"/><line id="c2r" class="ln2" style="stroke:var(--f5)"/><circle id="c2" r="9" style="fill:var(--f5)"/>${tc(g2.X(0),g2.Y(0)+22,'(h, k)','dim',null,'middle',20)}</g>
<g data-b="3">${pc(g3,t=>2*Math.cos(t)**3,t=>2*Math.sin(t)**3,0,2*PI,'f3',null,{n:400})}<circle id="c3" r="9" style="fill:var(--f5)"/></g>
`)}
${N(90,555,400,'<b>Segmento</b> de <i>A</i> a <i>B</i>, <i>t</i> ∈ [0, 1]',1)}
${Q(90,600,'x = x_1 + t(x_2 − x_1)',1,'xs')}
${Q(90,645,'y = y_1 + t(y_2 − y_1)',1,'xs')}
${N(520,555,360,'<b>Circunferencia</b>, <i>t</i> ∈ [0, 2π]',2)}
${Q(520,600,'x = a cos t + h',2,'xs')}
${Q(520,645,'y = a sen t + k',2,'xs')}
${N(920,555,300,'<b>Astroide</b>, <i>t</i> ∈ [0, 2π]',3)}
${Q(920,600,'x = a cos^3 t',3,'xs')}
${Q(920,645,'y = a sen^3 t',3,'xs')}
${N(90,170,1100,'Las tres de la clase, recorridas para <i>t</i> en su intervalo.',0)}`,
beats:[
`Veamos las tres parametrizaciones de la clase, que conviene saber de memoria.`,
`El segmento de recta que va de A, de coordenadas x uno, y uno, a B, de coordenadas x dos, y dos. x es x uno más t por, x dos menos x uno, y lo mismo para y, con t entre cero y uno. Cuando t es cero estás en A, cuando t es uno estás en B, y en t igual a un medio estás justo en la mitad.`,
`La circunferencia de centro h, k y radio a: x es a coseno de t más h, y es a seno de t más k, con t entre cero y 2 pi. Recorre la circunferencia una vez, en sentido antihorario, partiendo del punto de más a la derecha. El parámetro t es el ángulo.`,
`Y la astroide: x es a coseno al cubo de t, y es a seno al cubo de t. Es la curva que dibuja un punto de una circunferencia que rueda por dentro de otra cuatro veces más grande. Tiene cuatro puntas. Su ecuación implícita es x a la dos tercios más y a la dos tercios igual a a a la dos tercios.`],
loop(st,r){const s=(st*.3)%1,u=0.5-0.5*Math.cos(2*PI*s);setT(r,'c1',g1.X(.3+3.7*u),g1.Y(.5+2.9*u));const t=st*.9;const x2=g2.X(0)+120*Math.cos(t),y2=g2.Y(0)-120*Math.sin(t);setT(r,'c2',x2,y2);setL(r,'c2r',g2.X(0),g2.Y(0),x2,y2);setT(r,'c3',g3.X(2*Math.cos(t)**3),g3.Y(2*Math.sin(t)**3))}
});}

{const g=G(150,520,95,95);
S({title:'La cicloide',
html:`${svg(`
${axes(g,-0.2,11,-0.2,2.6,0,{xt:[[PI,'π'],[2*PI,'2π'],[3*PI,'3π']],yt:[[2,'2']]})}
${pc(g,t=>t-Math.sin(t),t=>1-Math.cos(t),0,4*PI,'line',0,{w:2,op:.5,dash:true})}
<path id="cy_tr" class="ln" style="stroke:var(--f1);stroke-width:4"/>
<circle id="cy_c" r="95" class="ln2" style="fill:rgba(143,199,255,.05);stroke:var(--f2)"/>
<line id="cy_r" class="ln2" style="stroke:var(--f2)"/>
<circle id="cy_p" r="9" style="fill:var(--f5)"/>
`)}
${Q(90,580,'x = a(t − sen t),     y = a(1 − cos t)',1,'s box')}
${N(700,585,520,'Un punto del borde de una rueda de radio <i>a</i> que gira sin deslizar.',2)}`,
beats:[
`Una curva paramétrica más, que aparece en varios ejercicios: la cicloide.`,
`Imagina una rueda de radio a que avanza girando sobre el suelo, sin deslizar, y marca un punto en su borde. Ese punto dibuja la cicloide. Sus ecuaciones son x igual a a por, t menos seno de t, e y igual a a por, 1 menos coseno de t. Aquí a vale 1.`,
`Cada vuelta completa de la rueda, o sea, cada vez que t avanza 2 pi, se dibuja un arco. El punto toca el suelo en t igual a cero, 2 pi, 4 pi, y llega a su altura máxima, 2 a, en t igual a pi.`],
loop(st,r){const T=(st*.7)%(4*PI);setD(r,'cy_tr',ppD(g,t=>t-Math.sin(t),t=>1-Math.cos(t),0,T,Math.max(2,Math.round(T*30))));const cx=g.X(T),cy=g.Y(1),px=g.X(T-Math.sin(T)),py=g.Y(1-Math.cos(T));const c=r.querySelector('#cy_c');if(c){c.setAttribute('cx',cx);c.setAttribute('cy',cy)}setL(r,'cy_r',cx,cy,px,py);setT(r,'cy_p',px,py)}
});}

S({title:'La derivada de una curva paramétrica',
html:`
${Q(90,175,`${fr('dy','dx')} = ${fr('dy','dt')} · ${fr('dt','dx')} = ${fr('dy','dt')} · ${fr('1','dx/dt')}`,0,'s')}
${N(700,190,500,'Regla de la cadena + derivada de la inversa.',0)}
${Q(90,300,`${fr('dy','dx')} = ${fr('y′(t)','x′(t)')}     {{si}} x′(t) ≠ 0`,1,'box')}
${P(90,430,'Tangente horizontal','f4',2)}
${Q(420,424,'y′(t_0) = 0  {{y}}  x′(t_0) ≠ 0',2,'s')}
${P(90,510,'Tangente vertical','f6',3)}
${Q(420,504,'x′(t_0) = 0  {{y}}  y′(t_0) ≠ 0',3,'s')}
${N(90,590,1100,'Si las dos derivadas son cero, el criterio no dice nada: hay que estudiar ese punto aparte.',4)}`,
beats:[
`Ahora, derivadas. Queremos la pendiente de la recta tangente, d y d x, pero x e y están dadas en función de t. Usamos la regla de la cadena: d y d x es d y d t por d t d x. Y por el teorema de la función inversa, d t d x es 1 partido por d x d t. Esto vale donde x prima de t no es cero.`,
`Resultado: la derivada de una curva paramétrica es y prima de t partido por x prima de t. Derivas cada coordenada con respecto a t, y divides la de y por la de x. Es la fórmula más importante del capítulo.`,
`De ahí salen las tangentes horizontales: la pendiente es cero cuando el numerador es cero y el denominador no. O sea, y prima de t cero, y x prima de t distinto de cero.`,
`Y las tangentes verticales: cuando la pendiente explota, o sea, el denominador es cero y el numerador no. x prima de t cero, y y prima de t distinto de cero.`,
`Si ambas derivadas son cero en el mismo t, la fórmula da cero partido por cero, y el criterio no dice nada. Ese punto hay que estudiarlo aparte, por ejemplo con un límite.`]
});

{const g=G(220,410,75,55),X=t=>t*t,Y=t=>t*t*t-3*t,s3=Math.sqrt(3);
S({title:'Ejemplo: dos tangentes en el mismo punto',
html:`${svg(`
${axes(g,-0.6,4.8,-3.9,3.9,0,{xt:[[3,'3']],yt:[]})}
${pc(g,X,Y,-2.05,2.05,'f1',0)}
${cv(g,x=>s3*(x-3),1.2,4.5,'f4',4,{w:3,lim:3.8})}${cv(g,x=>-s3*(x-3),1.2,4.5,'f3',4,{w:3,lim:3.8})}
${fdot(g.X(3),g.Y(0),'f5',1,8)}${tc(g.X(3)+16,g.Y(0)+24,'(3, 0)','f5',1,'start',22)}
`)}
${Q(660,170,'x = t^2,   y = t^3 − 3t',0,'s')}
${Q(660,240,'t^2 = 3  {{y}}  t(t^2 − 3) = 0  ⇒  t = ±√3',1,'s')}
${Q(660,320,`${fr('dy','dx')} = ${fr('3t^2 − 3','2t')}`,2,'s')}
${Q(660,420,`t = √3: ${fr('6','2√3')} = √3       t = −√3: −√3`,3,'xs')}
${Q(660,510,'y = √3 (x − 3)     {{y}}     y = −√3 (x − 3)',4,'s box')}
${N(660,600,560,'La curva pasa <b>dos veces</b> por (3, 0), con direcciones distintas.',4)}`,
beats:[
`Ejercicio de la clase: la curva x igual a t cuadrado, y igual a t cubo menos 3 t. Demostrar que tiene dos rectas tangentes en el punto 3, cero, y encontrarlas.`,
`Primero: ¿para qué valores de t la curva pasa por 3, cero? Necesitamos t cuadrado igual a 3, y t cubo menos 3 t igual a cero. La segunda se factoriza como t por, t cuadrado menos 3, que es cero si t es cero o si t cuadrado es 3. Como además t cuadrado tiene que ser 3, queda t igual a raíz de 3 o menos raíz de 3. La curva pasa dos veces por el mismo punto.`,
`Derivamos: y prima es 3 t cuadrado menos 3, x prima es 2 t. La pendiente es, 3 t cuadrado menos 3, partido por 2 t, para t distinto de cero.`,
`En t igual a raíz de 3: arriba, 3 por 3 menos 3, que es 6. Abajo, 2 raíz de 3. La pendiente es 6 partido por 2 raíz de 3, que simplificando es raíz de 3. En t igual a menos raíz de 3: arriba también 6, abajo menos 2 raíz de 3. La pendiente es menos raíz de 3.`,
`Dos pendientes distintas en el mismo punto: dos rectas tangentes. y igual a raíz de 3 por, x menos 3, e y igual a menos raíz de 3 por, x menos 3. En el dibujo se ve: la curva cruza el punto dos veces, una subiendo y otra bajando.`]
});}

S({title:'Segunda derivada: la cicloide',
html:`
${Q(90,170,`${fr('d^2 y','dx^2')} = ${fr('d/dt (dy/dx)','dx/dt')}`,0,'s box')}
${N(520,185,680,'Derivas <i>dy/dx</i> con respecto a <i>t</i>, y <b>vuelves a dividir</b> por <i>dx/dt</i>.',0)}
${Q(90,290,`x = t − sen t,  y = 1 − cos t:      ${fr('dy','dx')} = ${fr('sen t','1 − cos t')}`,1,'s')}
${Q(90,395,`${fr('d','dt')}(${fr('sen t','1 − cos t')}) = ${fr('cos t(1 − cos t) − sen^2 t','(1 − cos t)^2')} = ${fr('cos t − 1','(1 − cos t)^2')} = ${fr('−1','1 − cos t')}`,2,'xs')}
${Q(90,505,`${fr('d^2 y','dx^2')} = ${fr('−1/(1 − cos t)','1 − cos t')} = −${fr('1','(1 − cos t)^2')}`,3,'s')}
${Q(90,605,`t = ${fr('π','2')}:   −${fr('1','(1 − 0)^2')} = −1`,4,'s box')}
${N(640,610,560,'Error típico: olvidar dividir por <i>dx/dt</i>.',5)}`,
beats:[
`Ahora la segunda derivada paramétrica. La idea es aplicar la misma fórmula, pero a d y d x en vez de y: la segunda derivada es la derivada con respecto a t de d y d x, partido por d x d t.`,
`Ejercicio de la clase con la cicloide: x igual a t menos seno de t, y igual a 1 menos coseno de t. Calcular la segunda derivada en t igual a pi medios. Primero la primera derivada: y prima es seno de t, x prima es 1 menos coseno de t. Entonces d y d x es seno de t partido por, 1 menos coseno de t.`,
`Derivamos eso con respecto a t, con la regla del cociente: la derivada de arriba por lo de abajo, coseno por, 1 menos coseno, menos lo de arriba por la derivada de abajo, seno por seno. Todo partido por lo de abajo al cuadrado. Arriba queda coseno menos coseno cuadrado menos seno cuadrado. Y como coseno cuadrado más seno cuadrado es 1, arriba queda coseno menos 1, que es menos, 1 menos coseno. Se simplifica con uno de los factores de abajo, y queda menos 1 partido por, 1 menos coseno.`,
`Ahora el paso que no hay que olvidar: dividir otra vez por d x d t, que es 1 menos coseno de t. Queda menos 1 partido por, 1 menos coseno de t al cuadrado.`,
`En t igual a pi medios, coseno es cero, así que queda menos 1 partido por 1: la segunda derivada es menos 1. Es negativa, lo que coincide con que el arco de la cicloide es cóncavo hacia abajo.`,
`El error más común en este tema es derivar d y d x con respecto a t y quedarse ahí, sin dividir por d x d t. Eso da otra cosa.`]
});

${N(720,310,480,'<b>Horizontal:</b> <i>y</i> ′ = 0 ⇒ <i>t</i> = ±√(2/3), y ahí <i>x</i> ′ ≠ 0.',2)}
${Q(720,400,'(7/6, −4√6/9)   {{y}}   (7/6, 4√6/9)',2,'xs')}

beats:[
`Ejercicio de la clase: la curva x igual a t cuadrado más un medio, y igual a t cubo menos 2 t. Encontrar los puntos con tangente horizontal o vertical.`,
`Derivamos cada coordenada: x prima es 2 t, y prima es 3 t cuadrado menos 2.`,
`Tangentes horizontales: y prima igual a cero. 3 t cuadrado igual a 2, t igual a más o menos raíz de dos tercios. En esos t, x prima es 2 t, que no es cero. Sirven. Los puntos: x es dos tercios más un medio, siete sextos. Para y, t cubo menos 2 t es t por, t cuadrado menos 2, o sea raíz de dos tercios por, dos tercios menos 2, que da menos 4 raíz de 6 partido por 9. Con el t negativo, el signo cambia. Puntos: siete sextos, menos 4 raíz de 6 novenos, y siete sextos, más 4 raíz de 6 novenos.`,
`Tangentes verticales: x prima igual a cero, o sea t igual a cero. Ahí y prima es menos 2, distinto de cero. Sirve. El punto es un medio, cero. En el dibujo: dos tangentes horizontales en verde y una vertical en rojo, en la punta izquierda de la curva.`]
});}

S({title:'Área encerrada por una curva cerrada',
html:`${svg(`<g data-b="0">
${pth('M120 330 C 180 200, 300 360, 380 250',null,'ln','stroke:var(--f2);stroke-width:3.5')}${fdot(120,330,'f4')}${fdot(380,250,'f6')}${tc(250,380,'abierta','dim',null,'middle',22)}
${pth('M500 300 C 520 180, 700 180, 690 290 C 680 380, 520 400, 500 300 Z',null,'ln','stroke:var(--f1);stroke-width:3.5')}${tc(600,380,'cerrada y simple','f1',null,'middle',22)}
${pth('M840 300 C 860 150, 1000 420, 1060 280 C 1110 160, 900 160, 900 290 C 900 400, 830 380, 840 300 Z',null,'ln','stroke:var(--f6);stroke-width:3.5')}${tc(960,380,'cerrada, no simple','f6',null,'middle',22)}
</g>`)}
${N(90,165,1100,'<b>Cerrada:</b> termina donde empezó. <b>Simple:</b> no se cruza a sí misma.',0)}
${Q(90,440,`A = ${fr('1','2')} ${I('a','b')} (x y′ − x′ y) dt = ${I('a','b')} x y′ dt = ${I('a','b')} x′ y dt`,1,'s box')}
${N(90,530,1100,'Las tres dan el mismo número, salvo el <b>signo</b>: depende del sentido de recorrido. Toma el <b>valor absoluto</b>.',2)}
${N(90,620,1100,'También sirven para curvas abiertas si los extremos están sobre un <b>eje</b>.',3)}`,
beats:[
`Para el área, primero dos definiciones. Una curva paramétrica es cerrada si termina en el mismo punto donde empezó. Y es simple si no se cruza consigo misma. La del centro es cerrada y simple; la de la derecha es cerrada pero no simple, porque se cruza.`,
`Si la curva es cerrada y simple, el área que encierra se puede calcular con cualquiera de estas tres fórmulas: un medio de la integral de, x por y prima menos x prima por y. O la integral de x por y prima. O la integral de x prima por y.`,
`Las tres dan el mismo número, salvo el signo, que depende de si la curva se recorre en sentido antihorario u horario. Como un área es positiva, si te da negativo, tomas el valor absoluto. Elige la fórmula que deje la integral más fácil.`,
`Y un detalle de la clase: estas fórmulas también sirven si la curva no es cerrada, siempre que sus puntos inicial y final estén sobre alguno de los ejes. Así se calcula, por ejemplo, el área bajo un arco de cicloide.`]
});

S({title:'Ejemplos: circunferencia y astroide',
html:`
${Q(90,170,'x = a cos t,  y = a sen t  ⇒  y′ = a cos t',0,'s')}
${Q(90,240,`A = ${I('0','2π')} x y′ dt = a^2 ${I('0','2π')} cos^2 t dt = a^2 (${fr('t','2')} + ${fr('sen 2t','4')})${EV('0','2π')} = πa^2`,1,'xs box')}
${svg(ln(90,340,1190,340,2,'ln2'))}
${Q(90,365,'x = a cos^3 t:  x′ = −3a cos^2 t sen t      y = a sen^3 t:  y′ = 3a sen^2 t cos t',2,'xs')}
${Q(90,430,`x y′ − x′ y = 3a^2 cos^2 t sen^2 t (cos^2 t + sen^2 t) = ${fr('3a^2','4')} sen^2 2t`,3,'xs')}
${Q(90,525,`A = ${fr('1','2')} ${I('0','2π')} ${fr('3a^2','4')} sen^2 2t dt = ${fr('3a^2','8')} ${I('0','2π')} ${fr('1 − cos 4t','2')} dt = ${fr('3πa^2','8')}`,4,'xs box')}
${N(90,625,1100,'Truco: 2 sen <i>t</i> cos <i>t</i> = sen 2<i>t</i>, así que sen² <i>t</i> cos² <i>t</i> = ¼ sen² 2<i>t</i>.',3)}`,
beats:[
`Ejemplo de la clase: el área de la circunferencia de radio a, con x igual a a coseno de t, y igual a a seno de t. Usamos la fórmula de x por y prima. y prima es a coseno de t.`,
`x por y prima es a cuadrado coseno cuadrado de t. Con la identidad de coseno cuadrado, la antiderivada es t medios más seno de 2 t cuartos. Entre cero y 2 pi: pi más cero, menos cero. Resultado: pi a cuadrado. La fórmula conocida del círculo, comprobada.`,
`Ahora la astroide: x igual a a coseno al cubo, y igual a a seno al cubo. Derivamos con la cadena: x prima es menos 3 a coseno cuadrado seno, y prima es 3 a seno cuadrado coseno.`,
`Usamos la fórmula simétrica. x por y prima es 3 a cuadrado coseno a la cuarta seno cuadrado. Menos x prima por y es más 3 a cuadrado coseno cuadrado seno a la cuarta. Factorizando 3 a cuadrado coseno cuadrado seno cuadrado, queda multiplicado por coseno cuadrado más seno cuadrado, que es 1. Y como seno por coseno es seno de 2 t partido en 2, el producto de los cuadrados es un cuarto de seno cuadrado de 2 t.`,
`El área es un medio por tres cuartos a cuadrado, o sea tres octavos a cuadrado, por la integral de seno cuadrado de 2 t. Con la identidad de seno cuadrado: 1 menos coseno de 4 t, partido en 2. Integrando de cero a 2 pi, el coseno da cero y queda pi. Resultado: tres pi a cuadrado partido por 8.`]
});

{const g=G(150,600,70,70);
S({title:'Ejemplo: un arco de la cicloide',
html:`${svg(`
${axes(g,-0.2,7.2,-0.2,2.6,0,{xt:[[PI,'πa'],[2*PI,'2πa']],yt:[[2,'2a']]})}
${sh(`M${g.X(0)} ${g.Y(0)}`+ppD(g,t=>t-Math.sin(t),t=>1-Math.cos(t),0,2*PI).replace(/^M/,'L')+'Z','shade',1)}
${pc(g,t=>t-Math.sin(t),t=>1-Math.cos(t),0,2*PI,'f1',0)}
`)}
${Q(700,170,'x = a(t − sen t),  y = a(1 − cos t)',0,'xs')}
${N(700,225,520,'Abierta, pero empieza y termina <b>sobre el eje <i>x</i></b>.',0)}
${Q(700,310,`A = ${I('0','2π')} x′ y dt = a^2 ${I('0','2π')} (1 − cos t)^2 dt`,1,'xs')}
${Q(700,400,`= a^2 ${I('0','2π')} (${fr('3','2')} − 2 cos t + ${fr('cos 2t','2')}) dt`,2,'xs')}
${Q(700,500,`= a^2 (${fr('3t','2')} − 2 sen t + ${fr('sen 2t','4')})${EV('0','2π')} = 3πa^2`,3,'xs box')}
${N(700,600,520,'¡Tres veces el área de la rueda!',3)}`,
beats:[
`Ejemplo de la clase: el área entre un arco de la cicloide y el eje x. La curva no es cerrada, pero empieza en el origen y termina en 2 pi a, cero: ambos extremos están sobre el eje x, así que las fórmulas sirven.`,
`Aquí conviene la fórmula de x prima por y. x prima es a por, 1 menos coseno, e y es a por, 1 menos coseno. El producto es a cuadrado por, 1 menos coseno de t, al cuadrado.`,
`Desarrollamos el cuadrado: 1 menos 2 coseno más coseno cuadrado. Y el coseno cuadrado lo cambiamos por, 1 más coseno de 2 t, partido en 2. Juntando las constantes: tres medios menos 2 coseno de t más coseno de 2 t partido en 2.`,
`Integramos: tres t medios, menos 2 seno de t, más seno de 2 t cuartos. Entre cero y 2 pi, los senos dan cero, y queda tres medios por 2 pi, o sea 3 pi. El área es 3 pi a cuadrado. Una curiosidad: es exactamente tres veces el área de la rueda que la dibuja.`]
});}

S({title:'Longitud de arco en paramétricas',
html:`
${Q(640,180,`L = ${I('a','b')} ${rt('(dx/dt)^2 + (dy/dt)^2')} dt`,0,'l c box')}
${N(90,300,1100,'Mismo razonamiento que en cartesianas: cada segmento mide √(Δ<i>x</i>² + Δ<i>y</i>²), ahora con Δ<i>x</i> ≈ <i>x</i> ′Δ<i>t</i> y Δ<i>y</i> ≈ <i>y</i> ′Δ<i>t</i>.',1)}
${Q(90,410,'x = a cos t,  y = a sen t:   (−a sen t)^2 + (a cos t)^2 = a^2',2,'s')}
${Q(90,500,`L = ${I('0','2π')} a dt = 2πa`,3,'s box')}
${N(640,510,560,'El perímetro de la circunferencia, como debía ser.',3)}`,
beats:[
`Para la longitud de arco de una curva paramétrica, la fórmula es: la integral de a a b de raíz de, d x d t al cuadrado más d y d t al cuadrado, d t.`,
`Sale con el mismo razonamiento de antes: cada segmentito mide raíz de delta x cuadrado más delta y cuadrado, pero ahora delta x es aproximadamente x prima por delta t, y delta y es y prima por delta t. Sacando delta t de la raíz, aparece la fórmula.`,
`Ejemplo de la clase: la circunferencia de radio a. x prima es menos a seno de t, y prima es a coseno de t. Al elevar al cuadrado y sumar: a cuadrado seno cuadrado más a cuadrado coseno cuadrado, que es a cuadrado. La raíz es a.`,
`Integramos a de cero a 2 pi: da 2 pi a. El perímetro de la circunferencia, como era de esperar.`]
});

S({title:'Ejemplo: longitud de la astroide',
html:`
${Q(90,170,'(x′)^2 + (y′)^2 = 9a^2 cos^4 t sen^2 t + 9a^2 sen^4 t cos^2 t = 9a^2 sen^2 t cos^2 t',0,'xs')}
${Q(90,250,`${rt('(x′)^2 + (y′)^2')} = 3a |sen t cos t| = ${fr('3a','2')} |sen 2t|`,1,'s')}
${N(90,345,1100,'<b>Ojo con el valor absoluto:</b> sen 2<i>t</i> es negativo en parte de [0, 2π]. Usamos la <b>simetría</b>: 4 veces el primer cuadrante.',2)}
${Q(90,440,`L = 4 ${I('0','π/2')} ${fr('3a','2')} sen 2t dt = 6a (−${fr('cos 2t','2')})${EV('0','π/2')}`,3,'s')}
${Q(90,545,`= 6a (${fr('1','2')} + ${fr('1','2')}) = 6a`,4,'s box')}
${N(640,555,560,'Sin el valor absoluto, la integral de 0 a 2π daría <b>0</b>: absurdo.',4)}`,
beats:[
`Ejemplo de la clase: la longitud de la astroide. Ya teníamos las derivadas: x prima es menos 3 a coseno cuadrado seno, y prima es 3 a seno cuadrado coseno. Al cuadrado y sumando, sacamos factor común 9 a cuadrado seno cuadrado coseno cuadrado, y queda multiplicado por coseno cuadrado más seno cuadrado, que es 1.`,
`La raíz de 9 a cuadrado seno cuadrado coseno cuadrado es 3 a por el valor absoluto de seno por coseno. Ojo: la raíz de un cuadrado es el valor absoluto. Y como seno por coseno es seno de 2 t partido en 2, queda tres a medios por el valor absoluto de seno de 2 t.`,
`El valor absoluto molesta para integrar, porque seno de 2 t es negativo en parte del intervalo. La salida es la simetría: la astroide tiene cuatro arcos iguales, uno por cuadrante. Calculamos el del primer cuadrante, t entre cero y pi medios, donde seno de 2 t es positivo, y multiplicamos por 4.`,
`La integral: 4 por tres a medios es 6 a. La antiderivada de seno de 2 t es menos coseno de 2 t partido en 2.`,
`En pi medios, coseno de pi es menos 1, así que da un medio. En cero, coseno de cero es 1, así que da menos un medio. Restando: un medio más un medio, que es 1. Longitud: 6 a. Si hubieras ignorado el valor absoluto e integrado de cero a 2 pi, te daría cero, lo cual es absurdo para una longitud.`]
});

S({title:'Ejemplo: ln √(t² + 1) y arctan t',
html:`
${Q(90,170,`x = ln${rt('t^2 + 1')} = ${fr('1','2')} ln(t^2 + 1)  ⇒  x′ = ${fr('t','t^2 + 1')}       y′ = ${fr('1','t^2 + 1')}`,0,'xs')}
${Q(90,270,`(x′)^2 + (y′)^2 = ${fr('t^2 + 1','(t^2 + 1)^2')} = ${fr('1','t^2 + 1')}   ⇒   L = ${I('0','1')} ${fr('dt',rt('t^2 + 1'))}`,1,'xs')}
${Q(90,375,`t = tan θ,  dt = sec^2 θ dθ,  ${rt('t^2 + 1')} = sec θ;    t: 0 → 1  ⇔  θ: 0 → ${fr('π','4')}`,2,'xs')}
${Q(90,475,`L = ${I('0','π/4')} sec θ dθ = ln|sec θ + tan θ|${EV('0','π/4')}`,3,'s')}
${Q(90,575,'= ln(√2 + 1) − ln(1 + 0) = ln(1 + √2)',4,'s box')}
${N(760,585,440,'∫ sec θ dθ = ln|sec θ + tan θ| + <i>C</i> (compruébalo derivando)',3)}`,
beats:[
`Último ejemplo de la clase: la longitud de la curva x igual a logaritmo de raíz de t cuadrado más 1, y igual a arcotangente de t, para t entre cero y uno. Primero simplificamos x: logaritmo de una raíz es un medio del logaritmo. Su derivada es un medio por 2 t partido por, t cuadrado más 1, o sea t partido por, t cuadrado más 1. Y la derivada de arcotangente es 1 partido por, t cuadrado más 1.`,
`Elevamos al cuadrado y sumamos: arriba t cuadrado más 1, abajo t cuadrado más 1 al cuadrado. Se simplifica a 1 partido por, t cuadrado más 1. La raíz es 1 partido por raíz de t cuadrado más 1. Así que la longitud es la integral de cero a uno de d t partido por raíz de t cuadrado más 1.`,
`Esa integral tiene raíz de t cuadrado más 1: sustitución trigonométrica con tangente. t igual a tangente de theta, d t igual a secante cuadrado d theta, y la raíz se transforma en secante de theta. Como es integral definida, cambiamos los límites: t igual a cero da theta igual a cero, y t igual a uno da theta igual a pi cuartos.`,
`Queda secante cuadrado partido por secante, o sea la integral de secante de theta, de cero a pi cuartos. La integral de la secante es logaritmo del valor absoluto de, secante más tangente. Es una fórmula conocida que se comprueba derivando.`,

S({title:'Lo esencial, en una pantalla',
html:`
${CARD(90,170,355,200,'Antiderivadas',`${I()} f = F + C {{con}} F′ = f<br>{{tabla + linealidad}}<br>{{comprueba derivando}}`,0)}
${CARD(462,170,355,200,'Métodos',`u = g(x), du = g′ dx<br>${I()} u dv = uv − ${I()} v du<br>{{fracciones: divide y factoriza}}`,{b:0,d:.15})}
${CARD(834,170,355,200,'TFC',`(${I('a','x')} f)′ = f(x)<br>${I('a','b')} f = F(b) − F(a)<br>{{Leibniz:}} f(h)h′ − f(g)g′`,1)}
${CARD(90,390,355,200,'Cartesianas',`A = ${I()} (f − g) dx<br>L = ${I()} ${rt('1 + f′^2')} dx`,{b:1,d:.15})}
${CARD(462,390,355,200,'Paramétricas',`dy/dx = y′/x′<br>A = |${I()} x y′ dt|<br>L = ${I()} ${rt('x′^2 + y′^2')} dt`,2)}
${CARD(834,390,355,200,'Polares',`x = r cos θ, y = r sen θ<br>A = ½ ${I()} r^2 dθ<br>L = ${I()} ${rt('r^2 + r′^2')} dθ`,{b:2,d:.15})}`,
beats:[
`Para cerrar, lo esencial en una pantalla. Antiderivadas: la integral de f es F más C, con F prima igual a f; usa la tabla y la linealidad, y comprueba derivando. Métodos: en sustitución, u y d u; en partes, la integral de u d v es u v menos la integral de v d u; en fracciones parciales, si es impropia divide, y después factoriza el denominador.`,
`Teorema fundamental: la derivada de la integral de a a x de f es f de x; la integral de a a b es F de b menos F de a; y con límites variables, Leibniz, multiplicando por las derivadas de los límites. Cartesianas: área, la integral de arriba menos abajo; longitud, la integral de raíz de 1 más f prima al cuadrado.`,
`Paramétricas: la derivada es y prima partido por x prima; el área, el valor absoluto de la integral de x por y prima; la longitud, la integral de raíz de x prima cuadrado más y prima cuadrado. Polares: x igual a r coseno, y igual a r seno; el área es un medio de la integral de r cuadrado; la longitud, la integral de raíz de r cuadrado más r prima cuadrado.`]
});

</script>
<script>
(function(){
const $=s=>document.querySelector(s);
const stage=$('#stage'),frame=$('#frame'),player=$('#player'),bar=$('#bar'),fill=bar.querySelector('.fill'),knob=bar.querySelector('.knob'),tip=$('#tip');
const big=$('#big'),bPlay=$('#bPlay'),icPlay=$('#icPlay'),bVoice=$('#bVoice'),bSpeed=$('#bSpeed'),bFs=$('#bFs'),ctl=$('#ctl'),cap=$('#cap');
const KEY='mat071-c2-pos-v1';
let BE=[],TOTAL=0,g=0,t=0,playing=false,speed=1,voice=false,vDone=true,cur=null,curRoot=null,started=false,dragging=false,vTimer=null,sayTok=null,lastSave=0;
const SPEEDS=[.75,1,1.25,1.5,2];

/* timeline */
SC.forEach(s=>{s.start=TOTAL;s.beats.forEach((txt,j)=>{const w=txt.split(/\s+/).length;const d=Math.max(4.5,w*.37+1.6);BE.push({s:s.i,j,txt,d,st:TOTAL});TOTAL+=d});s.end=TOTAL});
CHS.forEach(c=>c.start=c.scenes[0].start);
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
$('#dur').textContent=`${CHS.length-1} capítulos · ${BE.length} pasos · ${fmt(TOTAL)}`;
CHS.forEach(c=>{if(c.start>0){const k=document.createElement('div');k.className='tick';k.style.left=(c.start/TOTAL*100)+'%';bar.appendChild(k)}});
const chBox=$('#chs');
CHS.forEach(c=>{const b=document.createElement('button');b.innerHTML=`<span class="n">${String(c.i).padStart(2,'0')}<br>${fmt(c.start)}</span><span><span class="t">${c.title}</span><span class="s">${c.sub}</span></span>`;b.onclick=()=>{go(idxAt(c.start+.01),0);if(!started)play();player.scrollIntoView({behavior:'smooth',block:'start'})};c.btn=b;chBox.appendChild(b)});
function idxAt(T){let lo=0,hi=BE.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(BE[m].st<=T)lo=m;else hi=m-1}return lo}

/* scenes */
function hdr(sc){return `<div class="hdr"><div class="tag">${sc.ch.sub} · ${sc.ch.title}</div><h2>${sc.title}</h2></div>`}
function card(c){return `<div class="card"><div class="cnum" data-b="0">${String(c.i).padStart(2,'0')}</div><div class="csub" data-b="0" data-d=".15">${c.sub}</div><div class="cttl" data-b="0" data-d=".3"${c.title.length>20?' style="font-size:64px"':''}>${c.title}</div>${svg(ln(146,520,1140,520,{b:0,d:.4},'ln','stroke:var(--acc);stroke-width:2'))}</div>`}
function mount(sc){
  const old=curRoot;if(old){old.classList.add('out');setTimeout(()=>old.remove(),1100)}
  const r=document.createElement('div');r.className='scene pre';
  r.innerHTML=sc.card?card(sc.ch):((sc.noHdr?'':hdr(sc))+sc.html);
  stage.appendChild(r);r._j=-1;cur=sc;curRoot=r;r.getBoundingClientRect();
  requestAnimationFrame(()=>r.classList.remove('pre'));
}
function apply(j,mnt){
  const r=curRoot,sc=cur;let k=0;
  r.querySelectorAll('[data-b]').forEach(el=>{const b=+el.dataset.b,want=b<=j,has=el.classList.contains('vis');
    if(want&&!has){const d=(mnt?.35:.05)+(+el.dataset.d||0)+(b===j?Math.min(k++,8)*.12:0);el.style.transitionDelay=d.toFixed(2)+'s';el._p=true}
    else if(!want){el._p=false;if(has){el.style.transitionDelay='0s';el.classList.remove('vis')}}});
  r._j=j;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{r.querySelectorAll('[data-b]').forEach(el=>{if(el._p&&+el.dataset.b<=r._j){el.classList.add('vis');el._p=false}})}));
  r.querySelectorAll('[data-x]').forEach(el=>el.classList.toggle('gone',j>=+el.dataset.x));
  r.querySelectorAll('[data-hl]').forEach(el=>el.classList.toggle('hl',el.dataset.hl.split(',').map(Number).includes(j)));
  if(sc.on){try{sc.on(j,r,mnt)}catch(e){console.error(e)}}
}
function go(i,tt=0,o={}){
  i=Math.max(0,Math.min(BE.length-1,i));const b=BE[i],sc=SC[b.s];let m=false;
  if(cur!==sc){mount(sc);m=true}
  const same=!m&&i===g&&curRoot._j===b.j;
  g=i;t=tt;if(!same)apply(b.j,m);
  $('#capTag').textContent=sc.ch.title+(sc.card?'':' · '+sc.title);
  $('#capTx').textContent=b.txt;
  $('#chName').textContent=sc.ch.title;
  CHS.forEach(c=>c.btn.classList.toggle('on',c===sc.ch));
  if(playing&&voice&&o.speak!==false)say(b.txt);
  ui();
}

/* voice */
let esVoice=null;const hasTTS='speechSynthesis' in window;
function pickVoice(){if(!hasTTS)return;const vs=speechSynthesis.getVoices();esVoice=vs.find(v=>/^es[-_](CL|419|MX|US|AR|CO)/i.test(v.lang))||vs.find(v=>/^es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}
if(hasTTS){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}else{bVoice.disabled=true;bVoice.title='Tu navegador no tiene síntesis de voz'}
function say(txt){
  if(!hasTTS){vDone=true;return}
  try{speechSynthesis.cancel()}catch(e){}
  vDone=false;const tok={};sayTok=tok;
  const parts=(txt.match(/[^.!?]+[.!?]*/g)||[txt]).map(p=>p.trim()).filter(Boolean);
  parts.forEach((p,k)=>{const u=new SpeechSynthesisUtterance(p);u.lang=esVoice?esVoice.lang:'es-ES';if(esVoice)u.voice=esVoice;u.rate=Math.min(2,speed*1.05);
    if(k===parts.length-1)u.onend=()=>{if(sayTok===tok)vDone=true};u.onerror=()=>{if(sayTok===tok)vDone=true};
    try{speechSynthesis.speak(u)}catch(e){vDone=true}});
  clearTimeout(vTimer);vTimer=setTimeout(()=>{if(sayTok===tok)vDone=true},(BE[g].d/speed)*1600+3000);
}
function hush(){if(hasTTS){sayTok=null;try{speechSynthesis.cancel()}catch(e){}}vDone=true}

/* transport */
function play(){if(!started){started=true;big.hidden=true;$('#resume').hidden=true}
  if(g===BE.length-1&&t>=BE[g].d-.05)go(0,0,{speak:false});
  playing=true;if(voice)say(BE[g].txt);ui()}
function pause(){playing=false;hush();ui()}
function next(){go(g+1,0)}
function prev(){if(t>2.5)go(g,0);else go(g-1,0)}
function ui(){icPlay.setAttribute('d',playing?'M6 5h4v14H6zM14 5h4v14h-4z':'M7 4.5v15l12-7.5z');bPlay.setAttribute('aria-label',playing?'Pausar':'Reproducir')}
bPlay.onclick=()=>playing?pause():play();big.onclick=play;
$('#bNext').onclick=next;$('#bPrev').onclick=prev;
bSpeed.onclick=()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];bSpeed.textContent=speed+'×';if(playing&&voice)say(BE[g].txt)};
bVoice.onclick=()=>{voice=!voice;bVoice.setAttribute('aria-pressed',voice);bVoice.textContent='Voz: '+(voice?'sí':'no');if(voice){pickVoice();if(playing)say(BE[g].txt)}else hush()};
bFs.onclick=()=>{if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen().catch(()=>{})}else if(player.requestFullscreen){player.requestFullscreen().catch(()=>{})}};
document.addEventListener('fullscreenchange',()=>setTimeout(fit,50));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.code==='Space'||e.key==='k'){e.preventDefault();playing?pause():play()}
  else if(e.key==='ArrowRight'){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev()}
  else if(e.key==='f'||e.key==='F'){bFs.click()}});

/* seek bar */
function TatX(x){const r=bar.getBoundingClientRect();return Math.max(0,Math.min(1,(x-r.left)/r.width))*TOTAL}
function seekT(T){const i=idxAt(T);go(i,Math.min(T-BE[i].st,BE[i].d-.05),{speak:false})}
bar.addEventListener('pointerdown',e=>{dragging=true;try{bar.setPointerCapture(e.pointerId)}catch(_){};seekT(TatX(e.clientX))});
bar.addEventListener('pointermove',e=>{const T=TatX(e.clientX);if(dragging)seekT(T);let c=CHS[0];CHS.forEach(h=>{if(h.start<=T)c=h});tip.hidden=false;tip.textContent=fmt(T)+' · '+c.title;const r=bar.getBoundingClientRect();tip.style.left=Math.max(70,Math.min(r.width-70,e.clientX-r.left))+'px'});
bar.addEventListener('pointerup',()=>{if(dragging){dragging=false;if(playing&&voice)say(BE[g].txt)}});
bar.addEventListener('pointerleave',()=>{tip.hidden=true});

/* resume */
let saved=0;try{saved=+localStorage.getItem(KEY)||0}catch(e){}
if(saved>20&&saved<TOTAL-10){$('#resume').hidden=false;$('#bRes').textContent='Continuar en '+fmt(saved);
  $('#bRes').onclick=()=>{seekT(saved);play()};$('#bRes0').onclick=()=>{seekT(0);play()}}

/* fit */
function fit(){const fs=document.fullscreenElement===player;
  if(fs){const W=window.innerWidth,H=window.innerHeight-ctl.offsetHeight-cap.offsetHeight;frame.style.width=Math.min(W,H*16/9)+'px'}else frame.style.width='';
  stage.style.transform=`scale(${frame.clientWidth/1280})`}
try{new ResizeObserver(fit).observe(frame)}catch(e){window.addEventListener('resize',fit)}
fit();

/* loop */
let last=performance.now();
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing&&!dragging){const b=BE[g];t+=dt*speed;
    if(voice){if(vDone&&t>=1.2){if(g<BE.length-1)go(g+1,0);else pause()}else if(t>b.d)t=b.d-.001}
    else if(t>=b.d){if(g<BE.length-1)go(g+1,t-b.d);else{t=b.d;pause()}}
    if(now-lastSave>2500){lastSave=now;try{localStorage.setItem(KEY,String(BE[g].st+t))}catch(e){}}}
  const b=BE[g],sc=SC[b.s];
  if(sc.loop&&curRoot&&cur===sc){try{sc.loop(b.st-sc.start+t,curRoot,b.j,t)}catch(e){}}
  const T=b.st+Math.min(t,b.d),p=T/TOTAL*100;fill.style.width=p+'%';knob.style.left=p+'%';
  bar.setAttribute('aria-valuenow',Math.round(T));bar.setAttribute('aria-valuemax',Math.round(TOTAL));
  $('#time').textContent=fmt(T)+' / '+fmt(TOTAL);
  requestAnimationFrame(loop)}

go(0,0,{speak:false});requestAnimationFrame(loop);

})();
</script>
